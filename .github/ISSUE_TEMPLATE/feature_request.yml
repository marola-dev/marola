name: Feature request
description: Propose something marola doesn't do yet.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Non-trivial changes (a new data source, a new pluggable integration, anything that
        changes scoring or what a user sees) go through a **MIP** first — see
        [`docs/mips/README.md`](../../docs/mips/README.md) and the `mip` skill
        (`.claude/skills/mip/SKILL.md`). This form is for proposing the idea; the MIP is where
        it gets designed.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's missing or annoying today, ideally with a real example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What you'd want to see instead — a CLI output, a Telegram reply, etc.
    validations:
      required: true
  - type: checkboxes
    id: mip
    attributes:
      label: MIP
      options:
        - label: I understand a non-trivial change needs a MIP before it's built
