name: scala-steward (dependency update PRs)

# Scans build.sbt/project/** for newer releases of every dependency (core/local/azure/cli — dspy/
# is Python-only, out of scope) and opens one PR per update it finds.

on:
  schedule:
    # Monday 12:00 UTC = 09:00 America/Sao_Paulo, the same slot dependabot.yml asks for, and for
    # the same reason: this runs on a desktop now. A scheduled job whose runner is asleep does not
    # fail, it queues — so the hour has to be one the machine is usually awake for, not 03:00 UTC.
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  scala-steward:
    # The action is a node24 action, not a container one, so it needs no Docker here — only the
    # JDK and sbt the two steps below install.
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: sbt/setup-sbt@v1

      - uses: scala-steward-org/scala-steward-action@v2
        with:
          github-token: ${{ secrets.STEWARD_GH_TOKEN || secrets.GITHUB_TOKEN }}
