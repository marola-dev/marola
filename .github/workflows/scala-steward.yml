name: scala-steward (dependency update PRs)

# Scans build.sbt/project/** for newer releases of every dependency (core/local/cli — dspy/
# is Python-only, out of scope) and opens one PR per update it finds.

on:
  schedule:
    # Monday 12:00 UTC, the same slot dependabot.yml asks for.
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: sbt/setup-sbt@v1

      - uses: scala-steward-org/scala-steward-action@v2
        with:
          github-token: ${{ secrets.STEWARD_GH_TOKEN || secrets.GITHUB_TOKEN }}
