name: scala-steward (dependency update PRs)

# Scans build.sbt/project/** for newer releases of every dependency (core/local/azure/cli — dspy/
# is Python-only, out of scope) and opens one PR per update it finds.

on:
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC — off the site build's :15/:45 cadence
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  scala-steward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: sbt/setup-sbt@v1

      - uses: scala-steward-org/scala-steward-action@v2
        with:
          github-token: ${{ secrets.STEWARD_GH_TOKEN || secrets.GITHUB_TOKEN }}
