name: skills

# Weekly: re-vendor the third-party skills under .claude/skills/ from their upstreams, 14 days
# behind HEAD, as one PR for a person to read (MIP-0080). Never merges on its own.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    uses: marola-dev/marola-devkit/.github/workflows/skills-update.yml@v0.8.2
    with:
      devkit-ref: v0.8.2
