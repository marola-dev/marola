name: marola E2E (manual)

# Manual trigger ONLY — no `push`/`pull_request`, deliberately: this hits live
# Overpass/Open-Meteo/ IMA and (optionally) a real local Ollama model.
on:
  workflow_dispatch:
    inputs:
      with_llm:
        description: "Also run the Ollama-backed tests (installs/caches a 1.3GB model)"
        type: boolean
        default: false
      model:
        description: "Ollama model for the llm job"
        type: string
        default: "llama3.2:1b"

concurrency:
  group: marola-e2e
  cancel-in-progress: true

env:
  SBT_E2E: sbt 'set cli/Test/testOptions := Seq(Tests.Argument(new TestFramework("munit.Framework"), "--include-tags=E2E"))'

jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: |
            ${{ runner.os }}-sbt-
      - uses: sbt/setup-sbt@v1
      # Only the tests that need no LLM: `MAROLA_E2E_SKIP_LLM=1` makes the Ollama-backed test
      # `assume(false)` immediately instead of probing localhost:11434.
      - name: E2E — live Overpass / Open-Meteo / IMA, no LLM
        env:
          MAROLA_E2E_SKIP_LLM: "1"
        run: ${{ env.SBT_E2E }} 'cli/testOnly marola.E2ESpec'

  llm:
    if: ${{ inputs.with_llm }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: |
            ${{ runner.os }}-sbt-
      - uses: sbt/setup-sbt@v1

      # The expensive part, cached: the model blobs (~1.3GB for llama3.2:1b) and the binary.
      - name: Cache Ollama binary and model
        id: ollama-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.ollama/models
            ~/.local/bin/ollama
            ~/.local/lib/ollama
          key: ollama-${{ runner.os }}-${{ inputs.model }}-v2

      - name: Install Ollama (cache miss only)
        if: steps.ollama-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local
          # bin/ollama needs its lib/ollama/llama-server sibling, so unpack both under ~/.local.
          # The GPU backends are ~2 GB of the 2.1 GB and useless on a CPU runner; keep them out of the cache.
          curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | tar --zstd -x -C ~/.local
          rm -rf ~/.local/lib/ollama/cuda_* ~/.local/lib/ollama/vulkan

      - name: Start Ollama and ensure the model
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 1; done
          ollama list | awk 'NR>1{print $1}' | grep -qx "${{ inputs.model }}" || ollama pull "${{ inputs.model }}"

      - name: E2E — full, including the Ollama-backed summarize/review test
        env:
          MAROLA_LOCAL_LLM_MODEL: ${{ inputs.model }}
        run: ${{ env.SBT_E2E }} 'cli/testOnly marola.E2ESpec'
