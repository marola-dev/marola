# marola-sea-publish — build and publish the marola-sea model to Hugging Face. MIP-0025.
# Manual dispatch only, on the self-hosted `marola-sea` runner; setup in docs/1-Using-marola/RUN-LOCALLY.md.
# CUDA torch comes from a venv (labs/cuda's setup-ml-venv, via flake.nix), not nixpkgs.
name: marola-sea publish

on:
  workflow_dispatch:
    inputs:
      preset:
        # Only what finetune/train_lora.py's PRESETS actually holds — it validates with
        # choices=sorted(PRESETS), so an option listed here that it does not know fails at train
        # time, after the venv build. `base` is absent because its weights are gated: a Hugging
        # Face login the runner does not have. qwen-27b is absent because it has never been run.
        description: "training preset (see finetune/train_lora.py PRESETS)"
        type: choice
        default: tiny
        options: [tiny, small, qwen-4b, qwen-7b, qwen-14b]
      resume:
        description: "resume DPO from the last checkpoint if one exists"
        type: boolean
        default: true
      major_version:
        # Leave both blank to keep the auto-increment: next marola-sea-v<N> after the highest
        # tag that exists. Set major to pin a version by hand, e.g. 2 + 1 -> marola-sea-v2.1.
        description: "major version (blank = auto-increment)"
        type: string
        default: ""
      minor_version:
        description: "minor version (used only when major is set; blank = 0)"
        type: string
        default: ""

permissions:
  contents: write   # only to push the marola-sea-v<N> tag after a successful publish

concurrency:
  group: marola-sea-publish
  cancel-in-progress: false   # never interrupt an upload half-done

env:
  # Outside the workspace on purpose — see the checkout step.
  CKPT_ROOT: ${{ github.workspace }}/../marola-checkpoints
  # Same reasoning: built once, reused by every later run.
  VENV_ROOT: ${{ github.workspace }}/../marola-ml-venv

jobs:
  publish:
    # The label is the whole point: only this workflow goes to your machine.
    runs-on: [self-hosted, marola-sea]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the version counter reads existing tags
          # `clean: true` (the default) runs `git clean -ffdx`, and -x removes IGNORED files —
          # which is where finetune/out/ lives.
          clean: true

      - name: refuse to run without a token, before doing 40 minutes of work
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret is not set — add a fine-grained Hugging Face token with write access to the target model repo." >&2
            exit 1
          fi
          echo "HF_TOKEN present"

      - name: preflight — does this run fit on this machine?
        env:
          PRESET: ${{ inputs.preset }}
        run: |
          set -euo pipefail
          python3 finetune/preflight.py --preset "$PRESET" --strict

      - name: python env with CUDA torch (venv, reused between runs)
        run: |
          set -euo pipefail
          REQUIREMENTS=finetune/requirements.txt nix develop --command setup-ml-venv

      - name: work out the version (manual major/minor, else auto-increment)
        id: version
        env:
          MAJOR: ${{ inputs.major_version }}
          MINOR: ${{ inputs.minor_version }}
        run: |
          set -euo pipefail
          if [ -n "${MAJOR// /}" ]; then
            case "$MAJOR" in ''|*[!0-9]*) echo "::error::major_version must be a number, got '$MAJOR'" >&2; exit 1 ;; esac
            case "${MINOR:-0}" in *[!0-9]*) echo "::error::minor_version must be a number, got '$MINOR'" >&2; exit 1 ;; esac
            version="v${MAJOR}.${MINOR:-0}"
            # Fail now, not after hours of training and an irreversible upload.
            if git rev-parse -q --verify "refs/tags/marola-sea-$version" >/dev/null; then
              echo "::error::marola-sea-$version already exists — pick another major/minor" >&2
              exit 1
            fi
            echo "publishing as $version (pinned by hand)"
          else
            # Reads the major of both tag shapes (v3 and v3.1), so a manual pin does not reset
            # the counter the next time this runs on auto.
            latest="$(git tag -l 'marola-sea-v*' | sed -E 's/^marola-sea-v([0-9]+).*$/\1/' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)"
            version="v$(( ${latest:-0} + 1 ))"
            echo "publishing as $version (auto-increment, previous major: ${latest:-none})"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=marola-sea-$version" >> "$GITHUB_OUTPUT"

      # build_dataset.py's Layer 1 and ask_ocean_question examples come from the pinned corpus.
      - run: scripts/corpus-fetch.sh
      - name: build the dataset (stdlib only, deterministic)
        run: |
          set -euo pipefail
          python3 finetune/build_dataset.py
          python3 finetune/build_dpo_dataset.py

      - name: train the SFT adapter, then DPO on top of it
        env:
          PRESET: ${{ inputs.preset }}
          RESUME: ${{ inputs.resume && '--resume' || '' }}
          CKPT_ROOT: ${{ env.CKPT_ROOT }}
          VENV_ROOT: ${{ env.VENV_ROOT }}
        run: |
          set -euo pipefail
          py="$VENV_ROOT/bin/python-cuda"   # wraps the venv python with libstdc++ on the path
          # Refuse rather than fall back to CPU: a silent fallback is hours wasted, not a warning.
          "$py" -c 'import torch, sys; sys.exit(0 if torch.cuda.is_available() else "no CUDA device visible to torch")'
          # tee, not >: the live log still streams to the Actions console so a stuck run is
          # visible while it happens, AND a full copy survives for the analysis step. Actions
          # truncates very long step logs in the web view; the artifact does not.
          mkdir -p training-logs
          # --out is passed explicitly because CKPT_ROOT is outside the checkout (it survives
          # between runs); the layout under it is the same out/<preset>/ the scripts default to.
          # shellcheck disable=SC2086
          "$py" finetune/train_lora.py --preset "$PRESET" --epochs 3 $RESUME \
            --out "$CKPT_ROOT/$PRESET/adapter" 2>&1 | tee training-logs/train_lora.log
          # shellcheck disable=SC2086
          "$py" finetune/train_dpo.py --preset "$PRESET" --epochs 1 $RESUME \
            --sft-adapter "$CKPT_ROOT/$PRESET/adapter" \
            --out "$CKPT_ROOT/$PRESET/dpo-adapter" 2>&1 | tee training-logs/train_dpo.log

      - name: analyse the run and put the report in the job summary
        # `always()`: a crashed or throttled run is exactly when the log is worth reading.
        if: always()
        env:
          PRESET: ${{ inputs.preset }}
          CKPT_ROOT: ${{ env.CKPT_ROOT }}
        run: |
          set -euo pipefail
          mkdir -p training-logs
          # The checkpoints live outside the workspace, so copy the state files in — they are a
          # few KB of JSON and they are the whole structured record of the run.
          # A missing state file is expected (that stage may not have run); a copy that fails
          # for any other reason is not, so this is an if rather than `&& cp || true` — which
          # swallowed the second case, and is the SC2015 older shellchecks flag.
          for d in adapter dpo-adapter; do
            src="$CKPT_ROOT/$PRESET/$d/trainer_state.json"
            if [ -f "$src" ]; then
              cp "$src" "training-logs/${d}-trainer_state.json"
            fi
          done
          python3 scripts/analyze_training.py \
            "$CKPT_ROOT/$PRESET/adapter" "$CKPT_ROOT/$PRESET/dpo-adapter" \
            --markdown training-logs/report.md --json training-logs/report.json || true
          # Renders inline on the run page — no download needed to see what happened.
          if [ -f training-logs/report.md ]; then cat training-logs/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: upload the logs and the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: training-logs-${{ inputs.preset }}-${{ github.run_id }}
          path: training-logs/
          retention-days: 90
          if-no-files-found: warn

      - name: merge the adapter into the base and export GGUFs
        run: |
          set -euo pipefail
          src="$(nix build --no-link --print-out-paths nixpkgs#llama-cpp.src)"
          nix shell nixpkgs#llama-cpp --command \
            "$VENV_ROOT/bin/python-cuda" finetune/merge_export.py --preset "${{ inputs.preset }}" --llama-cpp "$src" \
              --adapter "${CKPT_ROOT}/${{ inputs.preset }}/dpo-adapter" \
              --plan-json finetune/out/plan.json

      - name: publish to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Every name, path and licence below comes from the plan merge_export.py just wrote —
          # rebuilding them here is how the repo name, the GGUF path and the licence each ended up
          # disagreeing with the files on disk for one preset or another.
          eval "$(python3 -c "
          import json, shlex
          p = json.load(open('finetune/out/plan.json'))
          for k, v in (('NAME', p['name']), ('LICENCE', p['licence']), ('BASE_MODEL', p['base']),
                       ('Q4', p['gguf']['Q4_K_M']), ('Q8', p['gguf']['Q8_0'])):
              print(f'{k}={shlex.quote(v)}')
          ")"
          "$VENV_ROOT/bin/python-cuda" finetune/publish_hf.py \
            --repo "${GITHUB_REPOSITORY_OWNER}/${NAME}-GGUF" \
            --gguf "$Q4" \
            --gguf "$Q8" \
            --base-model "$BASE_MODEL" \
            --base-license "$LICENCE"

      - name: tag the release, only after a successful upload
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "marola-sea published to Hugging Face by ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}"
          git push origin "$TAG"
          echo "tagged $TAG"
