# marola-sea-publish — build and publish the marola-sea model to Hugging Face. MIP-0025.
name: marola-sea publish

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "training preset (see finetune/train_lora.py PRESETS)"
        type: choice
        default: qwen-7b
        options: [tiny, qwen-4b, qwen-7b, qwen-14b]
      resume:
        description: "resume from the last checkpoint if one exists"
        type: boolean
        default: true

permissions:
  contents: write   # only to push the marola-sea-v<N> tag after a successful publish

concurrency:
  group: marola-sea-publish
  cancel-in-progress: false   # never interrupt an upload half-done

env:
  # Outside the workspace on purpose — see the checkout step.
  CKPT_ROOT: ${{ github.workspace }}/../marola-checkpoints

jobs:
  publish:
    # The label is the whole point: only this workflow goes to your machine.
    runs-on: [self-hosted, marola-sea]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the version counter reads existing tags
          # `clean: true` (the default) runs `git clean -ffdx`, and -x removes IGNORED files —
          # which is where finetune/out/ lives.
          clean: true

      - name: refuse to run without a token, before doing 40 minutes of work
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret is not set — add a fine-grained Hugging Face token with write access to the target model repo." >&2
            exit 1
          fi
          echo "HF_TOKEN present"

      - name: preflight — does this run fit on this machine?
        env:
          PRESET: ${{ inputs.preset }}
        run: |
          set -euo pipefail
          nix shell --impure --expr "$(cat .github/nix-ml-env.nix)" --command \
            python3 finetune/preflight.py --preset "$PRESET" --strict

      - name: work out the next version (auto-increment, no input)
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag -l 'marola-sea-v*' | sed -E 's/^marola-sea-v//' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)"
          next=$(( ${latest:-0} + 1 ))
          echo "version=v$next" >> "$GITHUB_OUTPUT"
          echo "tag=marola-sea-v$next" >> "$GITHUB_OUTPUT"
          echo "publishing as v$next (previous: ${latest:-none})"

      - name: build the dataset (stdlib only, deterministic)
        run: |
          set -euo pipefail
          python3 finetune/build_dataset.py
          python3 finetune/build_dpo_dataset.py

      - name: confirm the GPU is visible to torch before spending hours on CPU
        run: |
          set -euo pipefail
          nix shell --impure --expr "$(cat .github/nix-ml-env.nix)" --command \
            python3 -c 'import torch; assert torch.cuda.is_available(), \
              "no CUDA device visible to torch — refusing to fall back to CPU silently"; \
              print("cuda:", torch.cuda.get_device_name(0))'

      - name: train the SFT adapter, then DPO on top of it
        env:
          PRESET: ${{ inputs.preset }}
          RESUME: ${{ inputs.resume && '--resume' || '' }}
          CKPT_ROOT: ${{ env.CKPT_ROOT }}
        run: |
          set -euo pipefail
          nix shell --impure --expr "$(cat .github/nix-ml-env.nix)" --command sh -c "
            python3 finetune/train_lora.py --preset '$PRESET' --epochs 3 $RESUME \
              --out '$CKPT_ROOT/$PRESET/adapter'
            python3 finetune/train_dpo.py --preset '$PRESET' --epochs 1 $RESUME \
              --sft-adapter '$CKPT_ROOT/$PRESET/adapter' \
              --out '$CKPT_ROOT/$PRESET/dpo-adapter'
          "

      - name: merge the adapter into the base and export GGUFs
        run: |
          set -euo pipefail
          src="$(nix build --no-link --print-out-paths nixpkgs#llama-cpp.src)"
          nix shell --impure --expr "$(cat .github/nix-ml-env.nix)" nixpkgs#llama-cpp --command \
            python3 finetune/merge_export.py --preset "${{ inputs.preset }}" --llama-cpp "$src" \
              --adapter "${CKPT_ROOT}/${{ inputs.preset }}/dpo-adapter"

      - name: publish to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRESET: ${{ inputs.preset }}
        run: |
          set -euo pipefail
          BASE_MODEL="$(python3 -c "import sys; sys.path.insert(0,'finetune'); from train_lora import PRESETS; print(PRESETS['$PRESET']['hf'])")"
          nix shell nixpkgs#python3Packages.huggingface-hub --command \
            python3 finetune/publish_hf.py \
            --repo "${GITHUB_REPOSITORY_OWNER}/marola-sea-${PRESET#qwen-}-GGUF" \
            --gguf "finetune/out/marola-sea-${PRESET}-Q4_K_M.gguf" \
            --gguf "finetune/out/marola-sea-${PRESET}-Q8_0.gguf" \
            --base-model "$BASE_MODEL" \
            --base-license apache-2.0

      - name: tag the release, only after a successful upload
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "marola-sea published to Hugging Face by ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}"
          git push origin "$TAG"
          echo "tagged $TAG"
