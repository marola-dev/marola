# marola-sea-publish — build and publish the marola-sea model to Hugging Face.
#
# NEVER automatic. `workflow_dispatch` only, and deliberately with no inputs: publishing a model
# to a public registry is an outward-facing, hard-to-unpublish act, so it happens when a human
# presses the button and never on a push, a schedule, or a merge. There is no `push:`, no
# `schedule:` and no `pull_request:` trigger here on purpose — adding one would turn a reviewed
# release into a side effect of ordinary work (AGENTS.md, "Cost & deployment safety").
#
# No inputs means the run has to decide the version itself, so it auto-increments: the next
# `marola-sea-v<N>` git tag after the highest one that already exists, starting at v1. The tag is
# pushed only after the upload succeeds, so a failed run does not burn a number and re-running is
# safe.
#
# Runs on YOUR machine, not GitHub's, via a self-hosted runner — this job downloads gigabytes of
# weights, burns CPU for the training run, and needs a Hugging Face token, none of which belongs
# on shared infrastructure. The `marola-sea` label is what keeps that specific: only a workflow
# that asks for the label lands on the runner, so every other workflow in this repo stays on
# GitHub's hosted runners untouched.
#
# One-time setup, on the machine that should build the model:
#   1. repo Settings -> Actions -> Runners -> New self-hosted runner; follow the download/config
#      steps it prints, and when it asks for additional labels enter: marola-sea
#   2. `./run.sh` (foreground) or install it as a service with `./svc.sh install && ./svc.sh start`
#   3. add the HF_TOKEN repository secret (Settings -> Secrets and variables -> Actions)
# Self-hosted runners are safe here because this repo is private; GitHub's warning against them is
# about public repos, where a fork's pull request could run code on your machine. This workflow has
# no pull_request trigger regardless.
#
# CUDA torch comes from PyTorch's wheel index via a venv (scripts/setup-ml-venv.sh), not nixpkgs.
# nixpkgs' torchWithCuda has no binary cache for this nixpkgs pin — the cuda-maintainers cache is
# built against nixos-unstable revisions, and Determinate's nixpkgs-weekly resolves elsewhere — so
# it compiles torch, magma and triton from source. nix still supplies llama-cpp and its converter.
# The venv lives outside the workspace and is reused between runs.
#
# Self-contained by necessity: `finetune/out/` is gitignored, so no adapter exists on a clean
# checkout and the job trains one. The preset is a dispatch input defaulting to `qwen-7b` — the
# Apache-2.0 model MIP-0048 §4 picks — rather than the `tiny` 360M pipeline proof it used to
# hardcode.
#
# It trains on the GPU. An earlier version named `pkgs.python3Packages.torch` (the CPU build) and
# passed `--no-4bit`, so a real run spent 46 minutes reaching 25% of a 360M training job while an
# idle RTX 4090 sat beside it. The env now uses torchWithCuda, `--no-4bit` is gone, and a step
# asserts `torch.cuda.is_available()` before any training starts — a silent CPU fallback is the
# expensive failure here, so it fails loudly instead.
#
# The chain is MIP-0025 §5.1's, end to end:
#   dataset -> SFT -> DPO -> peft merge -> convert_hf_to_gguf -> quantize -> upload
# The merge matters: train_lora.py emits a LoRA *adapter*, and `ollama run hf.co/...` cannot use
# one — it needs a standalone model GGUF. See finetune/merge_export.py.
#
# Requires an `HF_TOKEN` repository secret: a fine-grained Hugging Face token scoped to the target
# model repo with write access (publish_hf.py only calls create_repo and upload_file). A classic
# "write" token would grant far more than this needs.
name: marola-sea publish

on:
  workflow_dispatch:
    inputs:
      preset:
        description: "training preset (see finetune/train_lora.py PRESETS)"
        type: choice
        default: qwen-7b
        options: [tiny, qwen-4b, qwen-7b, qwen-14b]
      resume:
        description: "resume from the last checkpoint if one exists"
        type: boolean
        default: true

permissions:
  contents: write   # only to push the marola-sea-v<N> tag after a successful publish

concurrency:
  group: marola-sea-publish
  cancel-in-progress: false   # never interrupt an upload half-done

env:
  # Outside the workspace on purpose — see the checkout step. Survives `git clean -ffdx`, survives
  # the runner re-cloning, and is what makes a timed-out run resumable on the next dispatch.
  CKPT_ROOT: ${{ github.workspace }}/../marola-checkpoints
  # Same reasoning: built once, reused by every later run.
  VENV_ROOT: ${{ github.workspace }}/../marola-ml-venv

jobs:
  publish:
    # The label is the whole point: only this workflow goes to your machine.
    runs-on: [self-hosted, marola-sea]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the version counter reads existing tags
          # `clean: true` (the default) runs `git clean -ffdx`, and -x removes IGNORED files —
          # which is where finetune/out/ lives. On a self-hosted runner the workspace persists
          # between runs, so that default would wipe every checkpoint before training starts and
          # --resume would silently never trigger. Checkpoints therefore live outside the
          # workspace entirely (CKPT_ROOT below); the workspace itself is still cleaned, which is
          # what keeps a stale working tree from leaking between runs.
          clean: true

      - name: refuse to run without a token, before doing 40 minutes of work
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN secret is not set — add a fine-grained Hugging Face token with write access to the target model repo." >&2
            exit 1
          fi
          echo "HF_TOKEN present"

      - name: preflight — does this run fit on this machine?
        env:
          PRESET: ${{ inputs.preset }}
        run: |
          set -euo pipefail
          python3 finetune/preflight.py --preset "$PRESET" --strict

      - name: python env with CUDA torch (venv, reused between runs)
        run: |
          set -euo pipefail
          scripts/setup-ml-venv.sh

      - name: work out the next version (auto-increment, no input)
        id: version
        run: |
          set -euo pipefail
          latest="$(git tag -l 'marola-sea-v*' | sed -E 's/^marola-sea-v//' | grep -E '^[0-9]+$' | sort -n | tail -1 || true)"
          next=$(( ${latest:-0} + 1 ))
          echo "version=v$next" >> "$GITHUB_OUTPUT"
          echo "tag=marola-sea-v$next" >> "$GITHUB_OUTPUT"
          echo "publishing as v$next (previous: ${latest:-none})"

      - name: build the dataset (stdlib only, deterministic)
        run: |
          set -euo pipefail
          python3 finetune/build_dataset.py
          python3 finetune/build_dpo_dataset.py

      - name: train the SFT adapter, then DPO on top of it
        env:
          PRESET: ${{ inputs.preset }}
          RESUME: ${{ inputs.resume && '--resume' || '' }}
          CKPT_ROOT: ${{ env.CKPT_ROOT }}
          VENV_ROOT: ${{ env.VENV_ROOT }}
        run: |
          set -euo pipefail
          py="$VENV_ROOT/bin/python"
          # Refuse rather than fall back to CPU: a silent fallback is hours wasted, not a warning.
          "$py" -c 'import torch, sys; sys.exit(0 if torch.cuda.is_available() else "no CUDA device visible to torch")'
          # shellcheck disable=SC2086  # RESUME is intentionally an unquoted flag-or-empty
          "$py" finetune/train_lora.py --preset "$PRESET" --epochs 3 $RESUME \
            --out "$CKPT_ROOT/$PRESET/adapter"
          # shellcheck disable=SC2086
          "$py" finetune/train_dpo.py --preset "$PRESET" --epochs 1 $RESUME \
            --sft-adapter "$CKPT_ROOT/$PRESET/adapter" \
            --out "$CKPT_ROOT/$PRESET/dpo-adapter"

      - name: merge the adapter into the base and export GGUFs
        run: |
          set -euo pipefail
          src="$(nix build --no-link --print-out-paths nixpkgs#llama-cpp.src)"
          "$VENV_ROOT/bin/python" -m pip install --quiet gguf
          nix shell nixpkgs#llama-cpp --command \
            "$VENV_ROOT/bin/python" finetune/merge_export.py --preset "${{ inputs.preset }}" --llama-cpp "$src" \
              --adapter "${CKPT_ROOT}/${{ inputs.preset }}/dpo-adapter"

      - name: publish to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRESET: ${{ inputs.preset }}
        run: |
          set -euo pipefail
          BASE_MODEL="$(python3 -c "import sys; sys.path.insert(0,'finetune'); from train_lora import PRESETS; print(PRESETS['$PRESET']['hf'])")"
          "$VENV_ROOT/bin/python" finetune/publish_hf.py \
            --repo "${GITHUB_REPOSITORY_OWNER}/marola-sea-${PRESET#qwen-}-GGUF" \
            --gguf "finetune/out/marola-sea-${PRESET}-Q4_K_M.gguf" \
            --gguf "finetune/out/marola-sea-${PRESET}-Q8_0.gguf" \
            --base-model "$BASE_MODEL" \
            --base-license apache-2.0

      - name: tag the release, only after a successful upload
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "marola-sea published to Hugging Face by ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}"
          git push origin "$TAG"
          echo "tagged $TAG"
