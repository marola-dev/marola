name: marola-local (the fine-tuned model as an image, gated by the benchmark)

# MIP-0008 §5.3 — LLMOps in the small: the model is versioned like the code.

on:
  push:
    branches: [main]
    paths:
      - "finetune/Modelfile"
      - "Dockerfile.local"
      - "corpus.version"
      - "core/src/main/resources/**"
      - "cli/src/main/resources/benchmark_questions.json"
      - "scripts/benchmark_gate.py"
      - "docs/benchmarks/**"
      - ".github/workflows/docker-local.yml"
  workflow_dispatch:
    inputs:
      tolerance:
        description: "How far below the best kept rag-general coverage the new run may be"
        type: string
        default: "0.05"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-local
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/marola

jobs:
  build-gate-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile.local

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=raw,value=local-{{sha}}
      - name: Build and push :local-<sha> (the candidate)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.local
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=local
          cache-to: type=gha,scope=local,mode=max

      - name: Start the candidate
        run: |
          docker run -d --name ollama-local -p 11434:11434 "$IMAGE:local-${GITHUB_SHA::7}"
          for _ in $(seq 1 60); do curl -sf http://localhost:11434/api/tags >/dev/null && break; sleep 2; done
          curl -s http://localhost:11434/api/tags | grep -q marola-llama3.2

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: |
            ${{ runner.os }}-sbt-
      - uses: sbt/setup-sbt@v1

      # The same `just benchmark`, with the candidate's model; the embedder is the stock llama3.2
      # the image also carries (OllamaEmbedder's default).
      - run: scripts/corpus-fetch.sh
      - name: just benchmark against the candidate
        env:
          MAROLA_LOCAL_LLM_MODEL: marola-llama3.2
          MAROLA_KNOWLEDGE_DIR: .tmp/knowledge
        run: sbt "cli/run -- --benchmark"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-${{ github.run_id }}
          path: data/benchmark-*.md

      - name: Gate — compare with docs/benchmarks/
        run: python3 scripts/benchmark_gate.py check --new data --kept docs/benchmarks --tolerance "${{ inputs.tolerance || '0.05' }}"

      - name: Promote — move :local to this build
        run: |
          docker tag "$IMAGE:local-${GITHUB_SHA::7}" "$IMAGE:local"
          docker push "$IMAGE:local"
