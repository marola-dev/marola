name: site (build the boards, deploy the map)

# MIP-0005 §5.4: compute every area's board once on a schedule and publish site/dist as a static
# site — no server, no LLM, no per-visitor cost. MIP-0003.

on:
  schedule:
    - cron: "15 */3 * * *" # every 3 h (UTC); :15 avoids the top-of-hour crowd on shared runners
  # CD: a merge to main that changes the page or the pipeline redeploys right away instead of
  # waiting up to 3 h.
  push:
    branches: [main]
    paths:
      - "site/**"
      - "core/**"
      - "local/**"
      - "cli/**"
      - "build.sbt"
      - "project/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:
    inputs:
      area:
        description: "Area id from site/areas.json (empty = every area)"
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deploys at once; a queued run waits rather than cancelling a build that already paid
# for its Overpass query.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: |
            ${{ runner.os }}-sbt-
      - uses: sbt/setup-sbt@v1

      # `--site` with no id builds every area; the water-quality provider is picked per area
      # origin (IMA/SC inside Santa Catarina, "no data" elsewhere).
      - name: Build the boards (one Overpass query per area, no LLM)
        env:
          AREA: ${{ inputs.area }}
        run: |
          for attempt in 1 2; do
            if sbt "cli/run -- --site $AREA"; then exit 0; fi
            echo "site build attempt $attempt failed"
            [ "$attempt" -eq 2 ] || sleep 60
          done
          exit 1

      # fix/site-smoke-panel-null: stamp index.html's app.js/style.css tags with `?v=<sha>` so
      # Pages' CDN (each file cached independently, `cache-control: max-age=600` per file,
      # confirmed live) can never serve a fresh index.html next to a stale-cached app.js or the
      # reverse — the exact skew that let a page missing `#smoke` (PR #37) mismatch app.js's
      # still-current smoke-panel code and take the whole status line down with it.
      - name: Cache-bust index.html's script/stylesheet tags
        run: scripts/stamp_site_version.sh site/dist

      # MIP-0008 §5.5: the smoke test's results (docker-smoke.yml) live on the orphan `site-data`
      # branch — copied into the site here, never deployed by that workflow.
      - name: Add the smoke-test results and badge data — coverage, stats (site-data branch, if any)
        run: |
          if git fetch --depth=1 origin site-data 2>/dev/null; then
            for dir in smoke coverage stats; do
              if git cat-file -e "FETCH_HEAD:$dir" 2>/dev/null; then
                git archive FETCH_HEAD "$dir" | tar -x -C site/dist
              else
                echo "no $dir/ on site-data yet — no $dir panel"
              fi
            done
          else
            echo "no site-data branch yet — no smoke/coverage/stats panel"
          fi

      - name: Show what was built
        run: |
          find site/dist -type f | sort
          echo
          cat site/dist/data/*/latest.json
          if [ -f site/dist/smoke/latest.json ]; then
            head -c 600 site/dist/smoke/latest.json
          fi

      # A half-built site must never reach Pages.
      - name: Required files — the page, the areas index, one latest.json per area
        run: |
          cd site/dist
          missing=0
          for f in index.html app.js style.css vendor/leaflet.js data/areas.json \
                   $(python3 -c 'import json; [print("data/%s/latest.json" % a["id"]) for a in json.load(open("../areas.json"))]'); do
            if [ ! -f "$f" ]; then echo "missing: $f"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || { echo "site/dist is incomplete — not deploying"; exit 1; }

      # GitHub Pages custom domain (marola.dev): with actions/deploy-pages (not "Deploy from a
      # branch"), the CNAME file has to travel inside the artifact — there's no branch for GitHub
      # to read it from.
      - name: Write the custom-domain CNAME file
        run: echo "marola.dev" > site/dist/CNAME

      # Only the map is public.
      - name: Publish allowlist — index.html, app.js, style.css, chat.js, chatbot-config.js, CNAME, vendor/, data/, smoke/, coverage/, stats/ and nothing else
        run: |
          cd site/dist
          rm -f .gitkeep
          unexpected="$(find . -mindepth 1 \( -path ./data -o -path ./smoke -o -path ./coverage -o -path ./stats -o -path ./vendor \) -prune -o -type f ! -name index.html ! -name app.js ! -name style.css ! -name chat.js ! -name chatbot-config.js ! -name CNAME -print)"
          if [ -n "$unexpected" ]; then
            echo "files in site/dist that are not on the publish allowlist:"; echo "$unexpected"; exit 1
          fi
          echo "publishing:"; find . -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
