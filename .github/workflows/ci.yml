name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The routing bundle only (MIP-0084 §5.3): `changes` is skipped, and every job behind it with it.
  schedule:
    - cron: '41 4 * * *'

# dorny/paths-filter lists a PR's changed files through the API, which needs pull-requests: read;
# the repo's default GITHUB_TOKEN is contents-only ("Resource not accessible by integration").
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide what actually changed so the expensive job only runs when it can matter.
  changes:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      python: ${{ steps.filter.outputs.python }}
      workflows: ${{ steps.filter.outputs.workflows }}
      docker: ${{ steps.filter.outputs.docker }}
      justfile: ${{ steps.filter.outputs.justfile }}
      docs: ${{ steps.filter.outputs.docs }}
      nix: ${{ steps.filter.outputs.nix }}
      agents: ${{ steps.filter.outputs.agents }}
      wiring: ${{ steps.filter.outputs.wiring }}
      graph: ${{ steps.filter.outputs.graph }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'scripts/*.py'
              - '**/*.py'           # ruff lints the whole repo, so any .py anywhere counts
              - 'scripts/*.sh'      # gh-billing.sh's self-test lives in the same python-ci job
              - 'scripts/*.js'      # docs_redirect_check.js too
              - 'scripts/fixtures/**'
              - 'ruff.toml'
              - '.gitmodules'        # ruff_exclude_check.py reads it
              - 'docs/MIPs/*.tasks.md'        # mip_graph.py --check regenerates the graph from all of them
              - 'mkdocs/**'          # mkdocs.sh --self-test asserts on mkdocs.yml's kroki keys
              - '.github/workflows/ci.yml'  # the self-test list below
              - 'AGENTS.md'          # agents_repos_check.sh reads it
              - 'CLAUDE_PROJECT.config.md'  # claude_project_check.py reads it
            workflows:
              - '.github/workflows/**'
              - '.github/merge-key-allowlist'  # merge-key-check reads it
            docker:
              - 'mkdocs/**'          # its Dockerfile and compose stack are linted below
            justfile:
              - 'justfile'
            nix:
              - 'flake.nix'
              - 'flake.lock'
            agents:
              - 'AGENTS.md'
              - '.github/workflows/ci.yml'  # its devkit-ref pins the invariants block compared against
            wiring:                  # what `wiring --check` reads, beyond the workflows and the docs filter
              - 'wiring.allow'
              - 'scripts/**'
              - '.claude/settings.json'
            graph:                   # the gitlinks, the devkit pin and graphify's ignore list
              - &submodules [marola-site, marola-corpus, marola-ml, marola-app, marola-oods, marola-skills, marola-agents, marola-research]
              - 'flake.lock'
              - '.graphifyignore'
              - '.github/workflows/ci.yml'
              - 'routing-bench.yaml'
              - 'scripts/routing_bundle.py'
            docs:
              - 'docs/**'
              - 'mkdocs/**'
              - 'README.md'
              - 'flake.lock'         # marola-devkit mounts at its locked rev
              - 'scripts/prepare-docs.sh'
              - 'scripts/fetch-api-docs.sh'
              - 'scripts/lib/repos_manifest.sh'
              - 'scripts/lib/doc_links.py'
              - 'scripts/site_links_check.py'
              - 'scripts/mkdocs.sh'
              - '.gitmodules'
              - *submodules

  # README badges: this run's green steps, plus the Scala and Python line counts, counted in the
  # checked-out submodules (MIP-0070 §5.4: the umbrella runs repo_stats.py over every repo).
  repo-stats:
    needs: [changes, python-ci, static-ci, agents-check, quality-other]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # read this run's own jobs/steps (the default token is contents-only)
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # No magic-nix-cache: its post-step upload took 3–5 min and saved nothing (#657).
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: cloc + coverage.py from the lint shell
        shell: bash -eo pipefail {0}
        run: |
          nix develop .#lint --command which cloc coverage | xargs -n1 dirname | sort -u >> "$GITHUB_PATH"

      # The Python-coverage part re-runs every `scripts/**/*.py --self-test` under coverage.py —
      # seconds, no network — and reports statement % over scripts/ only.
      - name: Badge JSONs — CI health (steps green/ran), Scala/Python LOC, Python coverage
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/repo_stats.py write --out-dir stats --repo "$REPO" --run-id "$RUN_ID" --exclude-job repo-stats

      - id: bot
        uses: marola-dev/marola-devkit/.github/actions/bot-token@v0.20.4
        with:
          app-id: ${{ vars.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_KEY }}
          repositories: marola-site
          permission-contents: write
      - uses: actions/checkout@v7
        with:
          repository: marola-dev/marola-site
          ref: site-data
          path: site-data
          token: ${{ steps.bot.outputs.token }}
      - name: Publish the stats JSONs to marola-site's site-data branch
        run: |
          mkdir -p site-data/stats
          cp stats/*.json site-data/stats/
          git -C site-data add stats
          if git -C site-data diff --cached --quiet; then
            echo "stats unchanged — nothing to push"
          else
            git -C site-data commit -q -m "stats: ${{ github.sha }}"
            scripts/site-data-push.sh site-data
          fi
          # No dispatch: marola-site's scheduled build picks these up without an Overpass query.

  # docs.yml's build on the PR's pinned submodule commits (MIP-0070 §5.5): without this gate a
  # broken internal link merges green and then fails the docs.marola.dev deploy on main.
  docs-build:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # A page move is checked here, before merge, not first by docs.yml's deploy (MIP-0074 §7).
      - name: Save the live sitemap
        continue-on-error: true
        run: curl -sS -f --retry 3 --retry-all-errors --max-time 30 -o old-sitemap.xml https://docs.marola.dev/sitemap.xml || { rm -f old-sitemap.xml; exit 1; }
      - run: scripts/prepare-docs.sh
      - name: mkdocs --strict, in the Kroki container stack
        env:
          CONTAINER_RUNTIME: docker
          DOCS_SRC: .tmp/docs-aggregated
        run: scripts/mkdocs.sh
      - name: Every docs.marola.dev link resolves, and no old sitemap URL was dropped
        run: |
          if [ -s old-sitemap.xml ]; then
            python3 scripts/site_links_check.py mkdocs/generated-docs --old-sitemap old-sitemap.xml
          else
            echo "::warning::no live sitemap fetched; the dropped-URL check is skipped"
            python3 scripts/site_links_check.py mkdocs/generated-docs
          fi

  # MIP-0076 §5.4: a smoke test of each pointer move and devkit/graphify bump, and the graph as an
  # artifact for a session without Nix. MIP-0084 §5.3: on every push to main and daily, the graph,
  # the wiring and the bench score go to the routing-bundle branch, which `route` reads.
  graph:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.graph == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # No magic-nix-cache: its post-step upload took 3–5 min and saved nothing (#657).
      - uses: DeterminateSystems/nix-installer-action@v23
      # MIP-0076 §8's open item; without it graph.sh runs with no network isolation.
      - name: Does unshare -rn work on this runner?
        run: |
          if unshare -rn true; then echo "unshare -rn: available"; else echo "unshare -rn: not permitted"; fi
      # `graph`, not `just graph`: that recipe is in .devkit/devkit.just, a link only the default shell makes.
      - name: graph build on the pinned submodule commits
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/graph-cache
        run: nix develop .#lint --command graph build
      # graph.sh writes to $XDG_CACHE_HOME/marola-graph/<checkout dir name>, the repo's name here.
      - uses: actions/upload-artifact@v7
        with:
          name: graph
          path: |
            ${{ runner.temp }}/graph-cache/marola-graph/${{ github.event.repository.name }}/graph.json
            ${{ runner.temp }}/graph-cache/marola-graph/${{ github.event.repository.name }}/build.json
          retention-days: 7
          if-no-files-found: error
      # On a PR too, so a graphify or devkit bump that answers worse fails here, before main.
      - name: wiring, the indexes, route bench and the bundle's files
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/graph-cache
          GRAPH_DIR: ${{ runner.temp }}/graph-cache/marola-graph/${{ github.event.repository.name }}
        run: |
          nix develop .#lint --command wiring --json > "$GRAPH_DIR/wiring.json"
          # MIP-0085's indexes live only in the bundle (§5.4): DOC-CODE.md is not committed.
          nix develop .#lint --command doc-code --root . --graph "$GRAPH_DIR/graph.json" --json "$GRAPH_DIR/doc_code.json"
          nix develop .#lint --command decisions --mips docs/MIPs --json "$GRAPH_DIR/decisions.json"
          nix develop .#lint --command meaning-text --root . --graph "$GRAPH_DIR/graph.json" --out "$GRAPH_DIR/meaning.json"
          # route reads the wiring from a bundle ref, never a local graph: stage this run's files as
          # that ref, so the bench scores what would be published.
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage" && cp "$GRAPH_DIR"/{graph,build,wiring,doc_code,decisions,meaning}.json "$stage"/
          git -C "$stage" init -q && git -C "$stage" add -A
          git -C "$stage" -c user.name=ci -c user.email=ci@localhost commit -qm stage
          git fetch -q "$stage" +HEAD:refs/marola/routing-bundle
          nix develop .#lint --command route bench routing-bench.yaml | tee "$RUNNER_TEMP/bench.txt"
          # graphify is on the graph wrapper's PATH, not the shell's; its store path names the version.
          graph_bin=$(nix develop .#lint --command bash -c "command -v graph")
          graphify=$(grep -oE 'graphifyy?-[0-9][0-9.]*[0-9]' "$graph_bin" | head -1)
          if git fetch -q --depth 1 origin routing-bundle; then git show FETCH_HEAD:build.json > "$RUNNER_TEMP/previous.json"; fi
          python3 scripts/routing_bundle.py --graph-dir "$GRAPH_DIR" --out "$RUNNER_TEMP/bundle" \
            --bench "$RUNNER_TEMP/bench.txt" --questions routing-bench.yaml --previous "$RUNNER_TEMP/previous.json" --graphify "${graphify#*-}"
      - uses: actions/upload-artifact@v7
        with:
          name: routing-bundle
          path: ${{ runner.temp }}/bundle/
          retention-days: 7
          if-no-files-found: error

  # One orphan commit, force-pushed: the branch holds no history. Only marola-bundle-bot may write
  # the branch (routing-bundle-rule, .github/rulesets/routing-bundle.json), so the job holding its key
  # checks out nothing and runs no Nix (MIP-0084 §5.3).
  bundle-publish:
    needs: graph
    if: ${{ !cancelled() && needs.graph.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: routing-bundle
          path: bundle
      - uses: marola-dev/marola-devkit/.github/actions/bot-token@v0.20.4
        id: app
        with:
          app-id: ${{ vars.BUNDLE_BOT_APP_ID }}
          private-key: ${{ secrets.BUNDLE_BOT_KEY }}
          repositories: marola
          permission-contents: write
      - name: push routing-bundle as marola-bundle-bot
        working-directory: bundle
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          score=$(jq -r '"right first: \(.bench.right)/\(.bench.total)"' build.json)
          git init -q -b routing-bundle
          git add -A
          git commit -qm "routing-bundle: main@${GITHUB_SHA::7}" \
            -m "Tested: $score (route bench)" -m "Co-Authored-By: Claude <noreply@anthropic.com>"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/routing-bundle

  # Free, fast, and independent of the JVM build — the same gates as `just quality-other`, split
  # across the devkit's reusable workflows plus the nix-only checks below. The tool versions are
  # what flake.lock's nixpkgs builds for labs/lint (0968519): move them with `nix flake update`.
  python-ci:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: marola-dev/marola-devkit/.github/workflows/python-ci.yml@v0.20.4
    with:
      ruff-version: "0.16.5"
      self-test-commands: |
        python3 scripts/repo_stats.py --self-test
        scripts/gh-billing.sh --self-test
        scripts/site-data-push.sh --self-test
        scripts/pointer-sync.sh --self-test
        scripts/pointer-sync-merge.sh --self-test
        scripts/prepare-docs.sh --self-test
        scripts/fetch-api-docs.sh --self-test
        node scripts/docs_redirect_check.js
        python3 scripts/lib/doc_links.py --self-test
        python3 scripts/site_links_check.py --self-test
        scripts/agents_repos_check.sh --self-test
        scripts/agents_repos_check.sh
        python3 scripts/claude_project_check.py --self-test
        python3 scripts/claude_project_check.py
        python3 scripts/ruff_exclude_check.py --self-test
        python3 scripts/ruff_exclude_check.py
        python3 scripts/routing_bundle.py --self-test

  static-ci:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.docker == 'true'
    uses: marola-dev/marola-devkit/.github/workflows/static-ci.yml@v0.20.4
    with:
      actionlint-version: "1.7.12"
      hadolint-version: "2.14.0"
      hadolint-files: mkdocs/Dockerfile
      # Both mkdocs overrides must still render (MIP-0064).
      extra-commands: |
        docker compose -f mkdocs/docker-compose.yml -f mkdocs/docker-compose.build.yml config --quiet
        docker compose -f mkdocs/docker-compose.yml -f mkdocs/docker-compose.serve.yml config --quiet

  agents-check:
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    uses: marola-dev/marola-devkit/.github/workflows/agents-check.yml@v0.20.4
    with:
      devkit-ref: v0.20.4

  # What needs this repo's own flake: the lock is current, the justfile parses, no workflow here
  # is self-hosted (MIP-0065; the devkit's workflow-runners; marola-sea-publish.yml is marola-ml's),
  # only allowlisted workflows name the merge bot's key (merge-key-check),
  # docs-lint passes at the devkit flake.lock pins (MIP-0074 §7), REPOS.md's wiring block matches
  # every pinned repo (MIP-0076 §5.4), and DECISIONS.md matches the MIPs (MIP-0085 §5.6).
  quality-other:
    needs: changes
    if: needs.changes.outputs.nix == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.justfile == 'true' || needs.changes.outputs.docs == 'true' || needs.changes.outputs.wiring == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      # No magic-nix-cache: its post-step upload took 3–5 min and saved nothing (#657).
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: nix flake lock (adds a new input's pin, changes nothing else)
        id: lock
        run: nix flake lock
      - name: upload the regenerated flake.lock
        if: steps.lock.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: flake-lock
          path: flake.lock
          if-no-files-found: error
      - name: flake.lock is committed as nix flake lock leaves it
        run: |
          git diff --exit-code -- flake.lock || {
            echo "::error file=flake.lock::stale — commit the flake-lock artifact of this run (or run 'nix flake lock')"
            exit 1
          }
      # `which`, not `command -v`: the latter succeeds if any one name resolves. pipefail passes it on.
      - name: lint shell tools from nix develop .#lint
        shell: bash -eo pipefail {0}
        run: |
          nix develop .#lint --command which just workflow-runners docs-lint wiring decisions merge-key-check \
            | xargs -n1 dirname | sort -u >> "$GITHUB_PATH"
      # No opinion on style: `just --fmt --check` differed between a laptop and this runner.
      - name: just --list (the justfile parses)
        run: just --list >/dev/null
      - name: workflow-runners — no self-hosted workflow here (MIP-0065)
        run: workflow-runners
      - name: merge-key-check — only allowlisted workflows name the merge bot's key (MIP-0086 §5.6)
        run: merge-key-check .
      - name: docs-lint — no stale paths, recipes or links in README.md and docs/
        run: docs-lint
      # No .devkit link outside the default shell: wiring fetches each devkit ref it reads from GitHub.
      - name: wiring --check — REPOS.md's block is current, no orphan dispatch or unread artifact
        run: wiring --check docs/2-Building-marola/REPOS.md
      - name: decisions --check — DECISIONS.md is current with the MIPs (MIP-0085 §5.6)
        run: decisions --mips docs/MIPs --check

  # The one check ci-rule requires in every marola repo (marola-dev/marola#813); it must report on
  # every run, so it needs every other job and passes on skipped ones.
  ci-ok:
    if: always()
    needs: [changes, repo-stats, docs-build, graph, bundle-publish, python-ci, static-ci, agents-check, quality-other]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: every needed job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::a needed job ended $r"; exit 1 ;; esac
          done
