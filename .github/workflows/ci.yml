name: CI

on:
  push:
    branches: [main]
  pull_request:

# dorny/paths-filter lists a PR's changed files through the API, which needs pull-requests: read;
# the repo's default GITHUB_TOKEN is contents-only ("Resource not accessible by integration").
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide what actually changed so the expensive job only runs when it can matter.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scala: ${{ steps.filter.outputs.scala }}
      python: ${{ steps.filter.outputs.python }}
      workflows: ${{ steps.filter.outputs.workflows }}
      docker: ${{ steps.filter.outputs.docker }}
      justfile: ${{ steps.filter.outputs.justfile }}
      docs: ${{ steps.filter.outputs.docs }}
      nix: ${{ steps.filter.outputs.nix }}
      agents: ${{ steps.filter.outputs.agents }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            scala:
              - '**/*.scala'
              - '**/*.sbt'
              - 'project/**'
              - '.scalafmt.conf'
              - '.scalafix.conf'
              - '**/src/main/resources/**'
              - '**/src/test/resources/**'
              - 'knowledge/**'        # RagOfflineSpec reads the real corpus
              - '.github/workflows/ci.yml'
            python:
              - 'dspy/**'
              - 'finetune/**'
              - 'scripts/*.py'
              - '**/*.py'           # ruff lints the whole repo, so any .py anywhere counts
              - 'scripts/*.sh'      # gh-billing.sh's self-test lives in the same python-ci job
              - 'scripts/fixtures/**'
              - 'ruff.toml'
              - 'docs/MIPs/*.tasks.md'        # mip_graph.py --check regenerates the graph from all of them
              - 'mkdocs/**'          # mkdocs.sh --self-test asserts on mkdocs.yml's kroki keys
              - '.github/workflows/ci.yml'  # the self-test list below
            workflows:
              - '.github/workflows/**'
            docker:
              - 'Dockerfile*'
              - 'docker-compose.yml'
              - '.dockerignore'
              - 'mkdocs/**'          # its Dockerfile and compose stack are linted below too
            justfile:
              - 'justfile'
            nix:
              - 'flake.nix'
              - 'flake.lock'
            agents:
              - 'AGENTS.md'
              - '.github/workflows/ci.yml'  # its devkit-ref pins the invariants block compared against
            docs:
              - 'docs/**'
              - 'mkdocs/**'
              - '.gitmodules'
              - 'marola-site'

  build-test:
    needs: changes
    if: needs.changes.outputs.scala == 'true'
    uses: marola-dev/marola-devkit/.github/workflows/scala-ci.yml@v0.2.2

  # scala-ci leaves coverage out on purpose (marola-app-specific): `sbt-scoverage`
  # (project/plugins.sbt) re-instruments core/local/cli after the gate above passed, and
  # coverageAggregate sums one statement-coverage number across all three for the README badge.
  coverage:
    needs: [changes, build-test]
    if: needs.changes.outputs.scala == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache sbt / coursier
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Coverage — instrumented build, statement %, shields.io endpoint JSON
        run: |
          sbt clean coverage test coverageReport coverageAggregate
          xml="$(find target -maxdepth 3 -path '*/scoverage-report/scoverage.xml')"
          python3 - "$xml" > coverage.json <<'PY'
          import json, re, sys
          xml = open(sys.argv[1]).read()
          pct = float(re.search(r'statement-rate="([0-9.]+)"', xml).group(1))
          color = "red" if pct < 50 else "yellow" if pct < 80 else "green"
          # "sc-cov": the README also carries a Python "py-cov" badge.
          json.dump(
              {"schemaVersion": 1, "label": "sc-cov", "message": f"{pct:.0f}%", "color": color},
              sys.stdout,
          )
          PY
          echo && cat coverage.json

      # marola-site's site.yml copies coverage/, smoke/ and stats/ from its site-data into the map.
      - uses: actions/checkout@v7
        with:
          repository: marola-dev/marola-site
          ref: site-data
          path: site-data
          token: ${{ secrets.MAROLA_CROSS_REPO_PAT }}
      - name: Publish the coverage JSON to marola-site's site-data branch
        run: |
          mkdir -p site-data/coverage
          cp coverage.json site-data/coverage/latest.json
          git -C site-data config user.name "github-actions[bot]"
          git -C site-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site-data add coverage/latest.json
          if git -C site-data diff --cached --quiet; then
            echo "coverage unchanged — nothing to push"
          else
            git -C site-data commit -q -m "coverage: ${{ github.sha }}"
            scripts/site-data-push.sh site-data
          fi

      - name: Rebuild the map so the coverage badge refreshes
        env:
          GH_TOKEN: ${{ secrets.MAROLA_CROSS_REPO_PAT }}
        run: gh api repos/marola-dev/marola-site/dispatches -f event_type=site-data-updated || echo "could not dispatch to marola-site — its next scheduled build (≤ 3 h) will pick the coverage number up"

  # app -> ml contract (MIP-0070 §5.4): finetune/build_dataset.py and the benchmark gate read this
  # unpacked tarball instead of ../core once marola-ml is a separate repo.
  resources-tarball:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: scripts/build-resources-tarball.sh .tmp/ml-resources.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: ml-resources
          path: .tmp/ml-resources.tar.gz

  # README badges: this run's green steps, plus the Scala and Python line counts.
  repo-stats:
    needs: [changes, build-test, coverage, python-ci, static-ci, agents-check, quality-other]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # read this run's own jobs/steps (the default token is contents-only)
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: cloc + coverage.py from the lint shell
        shell: bash -eo pipefail {0}
        run: |
          nix develop .#lint --command which cloc coverage | xargs -n1 dirname | sort -u >> "$GITHUB_PATH"

      # The Python-coverage part re-runs every `scripts/**/*.py --self-test` under coverage.py —
      # seconds, no network — and reports statement % over scripts/ only.
      - name: Badge JSONs — CI health (steps green/ran), Scala/Python LOC, Python coverage
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/repo_stats.py write --out-dir stats --repo "$REPO" --run-id "$RUN_ID" --exclude-job repo-stats

      - uses: actions/checkout@v7
        with:
          repository: marola-dev/marola-site
          ref: site-data
          path: site-data
          token: ${{ secrets.MAROLA_CROSS_REPO_PAT }}
      - name: Publish the stats JSONs to marola-site's site-data branch
        run: |
          mkdir -p site-data/stats
          cp stats/*.json site-data/stats/
          git -C site-data config user.name "github-actions[bot]"
          git -C site-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site-data add stats
          if git -C site-data diff --cached --quiet; then
            echo "stats unchanged — nothing to push"
          else
            git -C site-data commit -q -m "stats: ${{ github.sha }}"
            scripts/site-data-push.sh site-data
          fi
          # No dispatch: marola-site's scheduled build picks these up without an Overpass query.

  # docs.yml's build on the PR's pinned submodule commits (MIP-0070 §5.5): without this gate a
  # broken internal link merges green and then fails the docs.marola.dev deploy on main.
  docs-build:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - run: scripts/prepare-docs.sh
      - name: mkdocs --strict, in the Kroki container stack
        env:
          CONTAINER_RUNTIME: docker
          DOCS_SRC: .tmp/docs-aggregated
        run: scripts/mkdocs.sh

  # Free, fast, and independent of the JVM build — the same gates as `just quality-other`, split
  # across the devkit's reusable workflows plus the nix-only checks below. The tool versions are
  # what flake.lock's nixpkgs builds for labs/lint (0968519): move them with `nix flake update`.
  python-ci:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    uses: marola-dev/marola-devkit/.github/workflows/python-ci.yml@v0.2.2
    with:
      ruff-version: "0.16.5"
      self-test-commands: |
        python3 scripts/smoke_record.py --self-test
        python3 scripts/benchmark_gate.py --self-test
        python3 scripts/repo_stats.py --self-test
        scripts/gh-billing.sh --self-test
        scripts/site-data-push.sh --self-test
        scripts/build-resources-tarball.sh --self-test
        python3 scripts/ocr-post.py --self-test
        scripts/prepare-docs.sh --self-test
        scripts/fetch-api-docs.sh --self-test

  static-ci:
    needs: changes
    if: needs.changes.outputs.workflows == 'true' || needs.changes.outputs.docker == 'true'
    uses: marola-dev/marola-devkit/.github/workflows/static-ci.yml@v0.2.2
    with:
      actionlint-version: "1.7.12"
      hadolint-version: "2.14.0"
      # Dockerfile.local is missing until MIP-0065 task 2 fixes its hadolint failure.
      hadolint-files: Dockerfile mkdocs/Dockerfile
      # Every compose profile must still render (MIP-0010), and both mkdocs overrides (MIP-0064).
      extra-commands: |
        docker compose --profile mlflow --profile ollama --profile local config --quiet
        docker compose -f mkdocs/docker-compose.yml -f mkdocs/docker-compose.build.yml config --quiet
        docker compose -f mkdocs/docker-compose.yml -f mkdocs/docker-compose.serve.yml config --quiet

  agents-check:
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    uses: marola-dev/marola-devkit/.github/workflows/agents-check.yml@v0.2.2
    with:
      devkit-ref: v0.2.2

  # What needs this repo's own flake: the lock is current, the justfile parses, and only
  # marola-sea-publish.yml may be self-hosted (MIP-0065; the devkit's workflow-runners).
  quality-other:
    needs: changes
    if: needs.changes.outputs.nix == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.justfile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: nix flake lock (adds a new input's pin, changes nothing else)
        id: lock
        run: nix flake lock
      - name: upload the regenerated flake.lock
        if: steps.lock.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: flake-lock
          path: flake.lock
          if-no-files-found: error
      - name: flake.lock is committed as nix flake lock leaves it
        run: |
          git diff --exit-code -- flake.lock || {
            echo "::error file=flake.lock::stale — commit the flake-lock artifact of this run (or run 'nix flake lock')"
            exit 1
          }
      # `which`, not `command -v`: the latter succeeds if any one name resolves. pipefail passes it on.
      - name: lint shell tools from nix develop .#lint
        shell: bash -eo pipefail {0}
        run: |
          nix develop .#lint --command which just workflow-runners \
            | xargs -n1 dirname | sort -u >> "$GITHUB_PATH"
      # No opinion on style: `just --fmt --check` differed between a laptop and this runner.
      - name: just --list (the justfile parses)
        run: just --list >/dev/null
      - name: workflow-runners — only marola-sea-publish.yml may be self-hosted (MIP-0065)
        run: workflow-runners
