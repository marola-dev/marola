name: CI

on:
  push:
    branches: [main]
  pull_request:

# dorny/paths-filter lists a PR's changed files through the API, which needs pull-requests: read;
# the repo's default GITHUB_TOKEN is contents-only ("Resource not accessible by integration").
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide what actually changed so the expensive job only runs when it can matter.
  changes:
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    timeout-minutes: 10
    outputs:
      scala: ${{ steps.filter.outputs.scala }}
      python: ${{ steps.filter.outputs.python }}
      workflows: ${{ steps.filter.outputs.workflows }}
      docker: ${{ steps.filter.outputs.docker }}
      site: ${{ steps.filter.outputs.site }}
      justfile: ${{ steps.filter.outputs.justfile }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            scala:
              - '**/*.scala'
              - '**/*.sbt'
              - 'project/**'
              - '.scalafmt.conf'
              - '.scalafix.conf'
              - '**/src/main/resources/**'
              - '**/src/test/resources/**'
              - 'knowledge/**'        # RagOfflineSpec reads the real corpus
              - '.github/workflows/ci.yml'
            python:
              - 'dspy/**'
              - 'finetune/**'
              - 'scripts/*.py'
              - '**/*.py'           # ruff lints the whole repo, so any .py anywhere counts
              - 'scripts/*.sh'      # gh-billing.sh's self-test lives in the same quality-other job
              - 'scripts/fixtures/**'
              - 'ruff.toml'
            site:
              - 'site/**'            # app.js/CSS/schema/fixtures → scripts/site_check.js (MIP-0009 task 2)
              - 'scripts/site_check.js'
            workflows:
              - '.github/workflows/**'
            docker:
              - 'Dockerfile*'
              - 'docker-compose.yml'
              - '.dockerignore'
            justfile:
              - 'justfile'

  build-test:
    needs: changes
    if: needs.changes.outputs.scala == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    timeout-minutes: 30
    # Elevated past the workflow-level `contents: read` only for this job's main-only coverage
    # steps below: pushing coverage/latest.json to the orphan site-data branch, and re-triggering
    # site.yml so the badge refreshes right away.
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      # Dependencies: keyed on the build definition only, so source edits keep the hit.
      - name: Cache sbt / coursier
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/coursier
            ~/.sbt
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      # Compiled classes + zinc's incremental-compile analysis.
      - name: Cache compiled classes (zinc incremental)
        uses: actions/cache@v6
        with:
          path: |
            core/target
            local/target
            azure/target
            cli/target
            project/target
            project/project/target
          key: ${{ runner.os }}-target-jdk25-${{ hashFiles('**/build.sbt', 'project/**') }}-${{ hashFiles('**/*.scala', '**/src/**/resources/**') }}
          restore-keys: |
            ${{ runner.os }}-target-jdk25-${{ hashFiles('**/build.sbt', 'project/**') }}-
            ${{ runner.os }}-target-jdk25-

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      # One sbt session for all three so the JVM/zinc warm-up is paid once, not three times.
      - name: Format check, scalafix, compile, test
        run: sbt scalafmtCheckAll "scalafixAll --check" compile test

      # Main only, and only after the checks above pass: `sbt-scoverage` (project/plugins.sbt)
      # re-instruments core/local/azure/cli, reruns the suite, and coverageAggregate sums one
      # statement-coverage number across all four for the README badge.
      - name: Coverage (main only) — instrumented build, statement %, shields.io endpoint JSON
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sbt clean coverage test coverageReport coverageAggregate
          xml="$(find target -maxdepth 3 -path '*/scoverage-report/scoverage.xml')"
          python3 - "$xml" > coverage.json <<'PY'
          import json, re, sys
          xml = open(sys.argv[1]).read()
          pct = float(re.search(r'statement-rate="([0-9.]+)"', xml).group(1))
          color = "red" if pct < 50 else "yellow" if pct < 80 else "green"
          # "sc-cov": the README also carries a Python "py-cov" badge.
          json.dump(
              {"schemaVersion": 1, "label": "sc-cov", "message": f"{pct:.0f}%", "color": color},
              sys.stdout,
          )
          PY
          echo && cat coverage.json
          # `sbt clean` above wiped the target/ dirs the "Cache compiled classes" step keys on.
          sbt coverageOff compile test

      # site.yml copies this orphan branch's smoke/ and coverage/ into site/dist (GITHUB_TOKEN only).
      - name: Publish the coverage JSON to the site-data branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git ls-remote --exit-code --heads origin site-data >/dev/null; then
            git fetch --depth=1 origin site-data
            git worktree add site-data FETCH_HEAD
            git -C site-data checkout -q -B site-data
          else
            git worktree add --detach site-data
            git -C site-data checkout -q --orphan site-data
            git -C site-data rm -rfq .
          fi
          mkdir -p site-data/coverage
          cp coverage.json site-data/coverage/latest.json
          git -C site-data config user.name "github-actions[bot]"
          git -C site-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site-data add coverage/latest.json
          if git -C site-data diff --cached --quiet; then
            echo "coverage unchanged — nothing to push"
          else
            git -C site-data commit -q -m "coverage: ${{ github.sha }}"
            git -C site-data push -q origin site-data
          fi

      # workflow_dispatch is one of the two events GITHUB_TOKEN may trigger from a workflow.
      - name: Rebuild the site so the coverage badge refreshes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml || echo "could not trigger site.yml — the next scheduled build (≤ 3 h) will pick the coverage number up"

  # README badges: this run's green steps, plus the Scala and Python line counts.
  repo-stats:
    needs: [changes, build-test, quality-other]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    timeout-minutes: 10
    permissions:
      contents: write # push the badge JSONs to the site-data branch
      actions: read # read this run's own jobs/steps (the default token is contents-only)
    steps:
      - uses: actions/checkout@v7

      # From nix, not apt: on the self-hosted runner `sudo apt-get` has no tty and hangs
      # (run 34709971906).
      - name: cloc + coverage.py from the lint shell
        if: runner.environment == 'self-hosted'
        run: |
          nix develop .#lint --command which cloc coverage | xargs -n1 dirname | sort -u >> "$GITHUB_PATH"

      # The CI_RUNNER=ubuntu-latest fallback: GitHub's image promises neither tool, but does have
      # a passwordless sudo and apt, so install them there the way this job always did.
      - name: cloc (only if the runner image does not already have it)
        if: runner.environment == 'github-hosted'
        run: command -v cloc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends cloc; }

      - name: coverage.py (only if the runner image does not already have it)
        if: runner.environment == 'github-hosted'
        run: command -v coverage >/dev/null || python3 -c 'import coverage' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-coverage; }

      # The Python-coverage part re-runs every `scripts/**/*.py --self-test` under coverage.py —
      # seconds, no network — and reports statement % over scripts/ only.
      - name: Badge JSONs — CI health (steps green/ran), Scala/Python LOC, Python coverage
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/repo_stats.py write --out-dir stats --repo "$REPO" --run-id "$RUN_ID" --exclude-job repo-stats

      - name: Publish the stats JSONs to the site-data branch
        run: |
          if git ls-remote --exit-code --heads origin site-data >/dev/null; then
            git fetch --depth=1 origin site-data
            git worktree add site-data FETCH_HEAD
            git -C site-data checkout -q -B site-data
          else
            git worktree add --detach site-data
            git -C site-data checkout -q --orphan site-data
            git -C site-data rm -rfq .
          fi
          mkdir -p site-data/stats
          cp stats/*.json site-data/stats/
          git -C site-data config user.name "github-actions[bot]"
          git -C site-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site-data add stats
          if git -C site-data diff --cached --quiet; then
            echo "stats unchanged — nothing to push"
          else
            git -C site-data commit -q -m "stats: ${{ github.sha }}"
            git -C site-data push -q origin site-data
          fi
          # No site.yml trigger: the scheduled build picks these up without an Overpass query.

  # Free, fast, and independent of the JVM build: Python lint/format for dspy/ and finetune/, a
  # linter for these workflow files themselves, and hadolint for the Dockerfiles — the same gates
  # as `just quality`.
  quality-other:
    needs: changes
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.workflows == 'true' || needs.changes.outputs.docker == 'true' || needs.changes.outputs.site == 'true' || needs.changes.outputs.justfile == 'true'
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # just is already in labs/lint's tools (nix develop .#lint --command which just) — same
      # PATH-prepend pattern as the shellcheck/pyflakes step below, so no separate setup action.
      - name: just from the lint shell (self-hosted only — github-hosted has no nix)
        if: needs.changes.outputs.justfile == 'true' && runner.environment == 'self-hosted'
        run: |
          nix develop .#lint --command which just | xargs -n1 dirname | sort -u >> "$GITHUB_PATH"
      - name: just --list (justfile parses — no opinion on style, see quality-other's comment)
        if: needs.changes.outputs.justfile == 'true'
        run: just --list >/dev/null
      # ruff-action appends its `src` (default: the checkout root) to `args`, so this lints every
      # .py in the repo — the same `ruff check .` as `just quality-other`.
      - name: ruff check (every .py in the repo)
        if: needs.changes.outputs.python == 'true'
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.5"   # = labs/lint's ruff as marola locks it (nix develop .#lint --command ruff --version)
          args: check
      - name: ruff format --check
        if: needs.changes.outputs.python == 'true'
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.5"   # = labs/lint's ruff as marola locks it (nix develop .#lint --command ruff --version)
          args: format --check
      - name: self-tests — smoke_record (the smoke workflow's parser) and benchmark_gate (marola-local's gate)
        if: needs.changes.outputs.python == 'true'
        run: |
          python3 scripts/smoke_record.py --self-test
          python3 scripts/benchmark_gate.py --self-test
      - name: "self-test — cost-split (Cost: trailer parser + diff-size estimator)"
        if: needs.changes.outputs.python == 'true'
        run: python3 scripts/cost-split.py --self-test
      - name: self-test — repo_stats (CI-health step counting + LOC badge shaping)
        if: needs.changes.outputs.python == 'true'
        run: python3 scripts/repo_stats.py --self-test
      - name: self-test — gh-billing (GitHub billing-usage response shaping)
        if: needs.changes.outputs.python == 'true'
        run: scripts/gh-billing.sh --self-test
      - name: self-test — deps-stack (dependency-PR discovery ordering)
        if: needs.changes.outputs.python == 'true'
        run: scripts/deps-stack.sh --self-test
      - name: self-test — deps-merge (which dependency PRs are green enough to merge)
        if: needs.changes.outputs.python == 'true'
        run: scripts/deps-merge.sh --self-test
      - name: self-test — runner-preflight / gha-runner (the self-hosted runner's own checks)
        if: needs.changes.outputs.python == 'true'
        run: |
          scripts/runner-preflight.sh --self-test
          scripts/gha-runner.sh --self-test
      - name: self-test — req_merge (requirements-file conflict auto-resolve)
        if: needs.changes.outputs.python == 'true'
        run: python3 scripts/lib/req_merge.py --self-test
      - name: self-test — uses_merge (workflow `uses:` bump conflict auto-resolve)
        if: needs.changes.outputs.python == 'true'
        run: python3 scripts/lib/uses_merge.py --self-test
      - name: self-test — mip-stack (MIP-draft PR discovery ordering)
        if: needs.changes.outputs.python == 'true'
        run: scripts/mip-stack.sh --self-test
      - name: self-test — mip_index_merge (docs/mips/README.md row conflict auto-resolve)
        if: needs.changes.outputs.python == 'true'
        run: python3 scripts/lib/mip_index_merge.py --self-test
      - name: self-test — ocr-post (Open Code Review JSON → one advisory PR review, MIP-0060)
        if: needs.changes.outputs.python == 'true'
        run: python3 scripts/ocr-post.py --self-test
      - name: site harness — app.js against site/fixtures in a stub DOM (MIP-0009)
        if: needs.changes.outputs.site == 'true'
        run: |
          node --version
          node --check site/static/app.js
          node scripts/site_check.js
      # Put nix's shellcheck/pyflakes on PATH first, or raven-actions/actionlint installs its own
      # via tty-less `sudo apt-get`, which hangs on the self-hosted runner (run 34709971906).
      - name: shellcheck + pyflakes from the lint shell (self-hosted only — the action would apt-get them)
        if: needs.changes.outputs.workflows == 'true' && runner.environment == 'self-hosted'
        run: |
          nix develop .#lint --command which shellcheck pyflakes | xargs -n1 dirname | sort -u >> "$GITHUB_PATH"
      - name: actionlint (workflow files)
        if: needs.changes.outputs.workflows == 'true'
        uses: raven-actions/actionlint@v2
      - name: hadolint (Dockerfiles)
        if: needs.changes.outputs.docker == 'true'
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

      # MIP-0010: every compose profile must still render — the mlflow profile included.
      - name: docker compose config (all profiles)
        if: needs.changes.outputs.docker == 'true'
        run: docker compose --profile mlflow --profile ollama --profile local config --quiet
