# Fill a pull request's description from its commits the moment it exists, so a PR opened from the
# GitHub UI (or `gh pr create` without `just uprd`) never sits on the raw template's `<!-- fill -->`
# placeholders. The generator is the devkit's uprd at the pinned tag.
name: PR body

on:
  pull_request:
    # labeled/unlabeled only for task-partial, which flips Closes #N to Part of #N (#512).
    types: [opened, reopened, ready_for_review, synchronize, labeled, unlabeled]

# No concurrency block here: the callee declares `pr-body-<PR>` with cancel-in-progress, so a newer
# run supersedes an older one (else a synchronize run could rewrite Closes after a task-partial run
# wrote Part of). A second group here would deadlock against it.
permissions:
  contents: read
  pull-requests: write

jobs:
  # marola-devkit#53's `branch` job, inline until this repo's devkit pin includes it; then delete.
  branch:
    if: github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          DENY: "^claude/project-thread-"
        run: |
          if grep -Eq -- "$DENY" <<<"$HEAD_REF"; then
            echo "::error::branch '$HEAD_REF' matches '$DENY': push the work to claude/<issue-number>-<short-kebab-slug> (git push -u origin HEAD:claude/<issue>-<slug>) and open the PR from it"
            exit 1
          fi

  fill:
    uses: marola-dev/marola-devkit/.github/workflows/pr-body.yml@v0.8.0
    with:
      devkit-ref: v0.8.0
