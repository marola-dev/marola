# pr-body — fill a pull request's description from its commits the moment it exists, so a PR
# opened from the GitHub UI (or `gh pr create` without `just uprd`) never sits on the raw template
# with its `<!-- fill -->` placeholders. Runs `scripts/uprd.sh <PR#>` — the same generator
# `just uprd`/`just uprds` use locally (docs/DEV-FLOW.md §4) — with the repo's own token.
#
# When it rewrites, and when it does not: the body is regenerated on open/reopen/ready-for-review
# and on every push of new commits (What changed, Tested and Cost drift otherwise), but only while
# the body is empty, still the untouched template (a `<!-- fill` placeholder is present), or was
# written by uprd (its first-line `<!-- uprd:` marker is present). A body someone rewrote by hand
# has none of those and is left alone — delete the marker line to opt out of regeneration.
# The title is set from the first commit's subject (capped, scripts/lib/uprd_title.sh) only when
# GitHub's default was kept — the branch name, or its "Fix/dockerfile numeric uid" spelling. When
# the branch/commits are MIP-scoped (scripts/lib/mip_ref.sh's same 3-tier detection scripts/uprd.sh
# uses for the body's own MIP table row) and the subject doesn't already start with that MIP
# number, cap_title prepends "MIP-NNNN: " — fixed 2026-09-07 after a real PR's title didn't start
# with its MIP number even though the body's MIP row correctly linked it: the two used to be
# entirely disconnected code paths (title = raw subject only; MIP number = a separate table cell).
#
# Skipped for PRs from forks (the token is read-only there) and for bot PRs (dependabot and
# scala-steward write their own bodies).
name: PR body

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  fill:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !contains(fromJSON('["dependabot[bot]", "github-actions[bot]"]'), github.actor)
      && !startsWith(github.event.pull_request.head.ref, 'dependabot/')
      && !startsWith(github.event.pull_request.head.ref, 'update/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # uprd reads the whole branch range and both branches' tips
      - name: fill the description from the commits (scripts/uprd.sh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          body="$(gh pr view "$PR" --json body -q .body)"
          # A body that is byte-identical to the branch's own commit message was not written as a
          # PR description at all — it is what `gh pr create --fill` (or `--body-file <(git log
          # -1 --format=%B)`) leaves behind. Those bodies carry neither the template's `<!-- fill`
          # placeholder nor uprd's `<!-- uprd:` marker, so the hand-written check below used to
          # treat them as deliberate prose and skip regeneration: the step passed green while the
          # PR template was never applied. Real case, 2026-09-07: a batch of agent-opened PRs all
          # sat on their raw commit messages with this job reporting success on every one.
          # Comparing against the commits themselves is what distinguishes "derived" from
          # "authored" — a person who hand-writes a description does not reproduce the commit
          # message to the byte, and one who used `--fill` wanted the generator anyway.
          trim() { sed -e 's/[[:space:]]*$//' | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba'; }
          body_trimmed="$(trim <<<"$body")"
          derived=0
          if [ -n "$body_trimmed" ]; then
            while IFS= read -r sha; do
              [ -n "$sha" ] || continue
              if [ "$body_trimmed" = "$(git log -1 --format=%B "$sha" | trim)" ]; then derived=1; break; fi
            done < <(git rev-list "origin/$BASE_REF..origin/$HEAD_REF")
            if [ "$derived" -eq 0 ] && [ "$body_trimmed" = "$(git log --reverse --format=%B "origin/$BASE_REF..origin/$HEAD_REF" | trim)" ]; then
              derived=1
            fi
          fi
          if [ "$derived" -eq 1 ]; then
            echo "PR #$PR's body is verbatim its commit message — treating as unfilled, regenerating"
          elif [ -n "$body" ] && ! grep -q '<!-- fill' <<<"$body" && ! grep -q '^<!-- uprd:' <<<"$body"; then
            echo "PR #$PR has a hand-written body — leaving it alone"
            exit 0
          fi
          git config user.name "github-actions[bot]"   # uprd never commits; git only needs an identity for `fetch` warnings to stay quiet
          scripts/uprd.sh "$PR"
      - name: title from the first commit, when GitHub's default was kept
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/lib/uprd_title.sh
          source scripts/lib/uprd_title.sh
          # shellcheck source=scripts/lib/mip_ref.sh
          source scripts/lib/mip_ref.sh
          mip_ref="$(detect_mip_ref "$HEAD_REF" "origin/$BASE_REF..origin/$HEAD_REF")"
          current="$(gh pr view "$PR" --json title -q .title)"
          norm() { tr '[:upper:]' '[:lower:]' <<<"$1" | sed -E 's/[^a-z0-9]+/ /g; s/^ //; s/ $//'; }
          # `|| true`: under pipefail, a `git log` output large enough for `head` to close the
          # pipe early kills git with SIGPIPE (141), which pipefail reports as the pipeline's
          # status even though `head` succeeded — set -e then kills the step. Same bug, same fix,
          # as scripts/uprd.sh's identical pattern (that one failed a real run with this exact
          # symptom on a branch whose range included a merge commit).
          first="$(git log --reverse --format=%s "origin/$BASE_REF..origin/$HEAD_REF" | head -1 || true)"
          [ -n "$first" ] || { echo "no commits past the base — nothing to title"; exit 0; }
          # GitHub's own "still default" title takes one of two shapes depending on how many
          # commits the branch has when the PR is first opened: the branch name (multi-commit),
          # or the sole commit's full, uncapped subject line verbatim (single-commit — every
          # branch this repo's agents push, one task = one commit). Checking only against the
          # branch name treated every single-commit PR's default title as "a human retitled it"
          # and never capped it — confirmed live, 2026-09-06.
          if [ "$(norm "$current")" != "$(norm "$HEAD_REF")" ] && [ "$current" != "$first" ]; then
            echo "PR #$PR title was set by a human — leaving it: $current"
            exit 0
          fi
          title="$(cap_title "$first" "$mip_ref")"
          gh pr edit "$PR" --title "$title"
          echo "PR #$PR title: $title"
