# docs — the umbrella's aggregated documentation site at docs.marola.dev: this repo at the root,
# every repo's README.md + docs/ and api-docs branch at 5-Repos/<name>/ (MIP-0074 §5.3). The map at
# marola.dev is marola-site's, deployed separately.
name: docs

on:
  # Sent by each submodule's notify-umbrella.yml (a devkit workflow).
  repository_dispatch:
    types: [submodule-docs-updated]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs/**'
      - 'README.md'
      - 'flake.lock' # marola-devkit mounts at its locked rev
      - 'scripts/prepare-docs.sh'
      - 'scripts/fetch-api-docs.sh'
      - 'scripts/lib/repos_manifest.sh'
      - 'scripts/lib/doc_links.py'
  schedule:
    - cron: "20 5 * * *" # once a day, off the hour other workflows use (CI-CD.md)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false # never kill a Pages deploy mid-way

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Taken before this run's own build can move a page: the only honest baseline for "did a
      # move drop a URL" is the site as it stood before this deploy (MIP-0074 §7). A site that is
      # down must not block the deploy that recovers it, so a failed fetch skips that check.
      - name: Save the live sitemap, before this build can change it
        continue-on-error: true
        run: curl -sS -f --retry 3 --retry-all-errors --max-time 30 -o old-sitemap.xml https://docs.marola.dev/sitemap.xml

      # §5.5: non-PR builds track each submodule's latest main; a PR build stays on the pinned
      # commit the gitlink already carries, so it doesn't fail on something merged after it opened.
      # No `pull_request` trigger here (ci.yml's docs-build is the PR build), so this always runs.
      - name: Track every submodule's latest main
        if: github.event_name != 'pull_request'
        run: git submodule update --init --remote

      # Builds .tmp/docs-aggregated, api-docs branches included; the tracked docs/ tree is never
      # written to (ruling T10-8).
      - name: Build the aggregated docs tree
        run: scripts/prepare-docs.sh

      - name: mkdocs (material + kroki), from the aggregated tree
        env:
          CONTAINER_RUNTIME: docker
          DOCS_SRC: .tmp/docs-aggregated
        run: scripts/mkdocs.sh

      - name: The published tree keeps script-src 'self'
        run: python3 scripts/strip_external_scripts.py --check mkdocs/generated-docs

      - name: Every docs.marola.dev link resolves, and no old sitemap URL was dropped
        run: |
          if [ -s old-sitemap.xml ]; then
            python3 scripts/site_links_check.py mkdocs/generated-docs --old-sitemap old-sitemap.xml
          else
            echo "::warning::no live sitemap fetched; the dropped-URL check is skipped"
            python3 scripts/site_links_check.py mkdocs/generated-docs
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: mkdocs/generated-docs

  # The custom domain is a repo setting: an Actions-deployed Pages site ignores a CNAME file.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
