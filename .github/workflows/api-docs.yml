# api-docs — build Scaladoc and publish it as api-docs.tar.gz on the rolling `api-docs` release,
# which docs.yml unpacks under docs.marola.dev/api/ (MIP-0070 §5.5). It moves to marola-app with
# the code (task 15); pdoc is marola-ml's own release asset.
name: API docs

on:
  push:
    branches: [main]
    paths:
      - '**/*.scala'
      - 'build.sbt'
      - 'project/**'
  workflow_dispatch:

permissions:
  contents: write   # create/update the release
  actions: write    # gh workflow run docs.yml

concurrency:
  group: api-docs
  cancel-in-progress: false # never kill a release upload mid-way

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt
      - uses: sbt/setup-sbt@v1

      - name: scaladoc, one tree per module
        run: |
          set -euo pipefail
          sbt core/doc local/doc cli/doc
          for m in core local cli; do
            mkdir -p out/api/scala/"$m"
            cp -r "$m"/target/scala-*/api/. out/api/scala/"$m"/
          done

      - name: strip third-party scripts so the docs keep script-src 'self'
        run: |
          set -euo pipefail
          python3 scripts/strip_external_scripts.py out/api/scala
          python3 scripts/strip_external_scripts.py --check out/api

      - name: publish api-docs.tar.gz on the api-docs release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tar -czf api-docs.tar.gz -C out/api .
          notes="Scaladoc from ${GITHUB_SHA::12}, unpacked by docs.yml under docs.marola.dev/api/."
          if gh release view api-docs >/dev/null 2>&1; then
            gh release upload api-docs api-docs.tar.gz --clobber
            gh release edit api-docs --notes "$notes" --latest
          else
            gh release create api-docs api-docs.tar.gz --target "$GITHUB_SHA" --title "API docs" --notes "$notes" --latest
          fi

      - name: redeploy docs.marola.dev with the new API docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml || echo "could not trigger docs.yml — its daily build will pick the API docs up"
