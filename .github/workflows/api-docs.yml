# api-docs — generate Scala/Python API docs and push them to the `site-data` branch. MIP-0044 §5.6.
# Not on the site's 3-hourly schedule: ~20 MB is uploaded when code changes, not eight times a day.
name: API docs

on:
  push:
    branches: [main]
    paths: ['**/*.scala', 'build.sbt', 'project/**', 'scripts/**.py', 'finetune/build_dataset.py']
  workflow_dispatch:

permissions:
  contents: write   # push the generated tree to the site-data branch
  actions: write    # and ask site.yml to redeploy it (see the last step)

concurrency:
  group: api-docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: sbt
      - uses: sbt/setup-sbt@v1

      - name: scaladoc, one tree per module
        run: |
          set -euo pipefail
          sbt core/doc local/doc azure/doc cli/doc
          for m in core local azure cli; do
            mkdir -p out/docs/api/scala/"$m"
            cp -r "$m"/target/scala-*/api/. out/docs/api/scala/"$m"/
          done

      - name: pdoc for the scripts
        run: |
          set -euo pipefail
          pip install --quiet pdoc
          # Stdlib-only CLI scripts, not a library — the index page says so, per MIP-0044 §5.6.
          pdoc -o out/docs/api/python scripts/*.py scripts/lib/*.py finetune/build_dataset.py || \
            echo "pdoc produced nothing for some inputs — continuing with what it did produce"

      - name: strip third-party scripts so the docs keep script-src 'self'
        run: |
          set -euo pipefail
          python3 scripts/strip_external_scripts.py out/docs/api/scala out/docs/api/python
          # --check reuses the stripper's own regex. The previous guard grepped for `src="http`,
          # which matched pdoc's rendering of strip_external_scripts.py's own docstring.
          python3 scripts/strip_external_scripts.py --check out/docs

      - name: build the docs index (guides, MIPs, API — one page, MIP-0044 §5.6)
        run: |
          set -euo pipefail
          python3 scripts/build_docs_index.py --out out/docs/index.html
          find out/docs -maxdepth 3 -name index.html | sort

      - name: push to the site-data branch
        id: push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tmp="$(mktemp -d)"
          if git fetch --depth=1 origin site-data 2>/dev/null; then
            git worktree add -f "$tmp" FETCH_HEAD --detach
          else
            git worktree add -f --detach "$tmp"
            git -C "$tmp" checkout --orphan site-data
            git -C "$tmp" rm -rq --cached . 2>/dev/null || true
          fi
          # The tree is docs/, not api/ — site.yml copies `docs` out of site-data. Removing and
          # staging `api` here left the copy unstaged and `add` with nothing to match.
          rm -rf "${tmp:?}/docs"
          cp -r out/docs "$tmp/docs"
          git -C "$tmp" add -A docs
          if git -C "$tmp" diff --cached --quiet; then
            echo "api docs unchanged — nothing to push"
            exit 0
          fi
          git -C "$tmp" commit -qm "api docs from ${GITHUB_SHA::12}"
          git -C "$tmp" push -q origin HEAD:site-data
          echo "pushed docs/ to site-data"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # site-data is not the published site: site.yml copies docs/ out of it into site/dist and
      # deploys that. Nothing here triggers site.yml — its push filter only watches site/, the
      # Scala modules and its own file — so without this the docs sit on the branch, invisible,
      # until the next 3-hourly build. That is why marola.dev/docs 404'd after both #305 and #306:
      # each fix landed and pushed correctly, and the site simply had not been rebuilt since.
      # Same mechanism ci.yml uses for the coverage badge; workflow_dispatch is one of the two
      # events GITHUB_TOKEN is allowed to trigger from inside a workflow.
      - name: Redeploy the site so the new docs are actually served
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml || echo "could not trigger site.yml — the next scheduled build (<= 3 h) will publish the docs"
