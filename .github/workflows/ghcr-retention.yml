name: ghcr-retention (prune old image tags)

# This repo is private, so GHCR storage is real cost (see docker.yml's cost-model comment), and
# nothing prunes the images docker.yml/docker-local.yml push.

on:
  schedule:
    - cron: "30 5 * * 1" # weekly, Monday 05:30 UTC
  workflow_dispatch:
    inputs:
      dry-run:
        description: "List what would be deleted without deleting it"
        type: boolean
        default: true

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: [jvm, native, dev, local]
    steps:
      - uses: snok/container-retention-policy@v3.1.0
        with:
          account: ${{ github.repository_owner }}
          token: ${{ secrets.GITHUB_TOKEN }}
          image-names: marola
          image-tags: "${{ matrix.target }}-*"
          keep-n-most-recent: ${{ matrix.target == 'local' && 5 || 10 }}
          cut-off: 1d
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || false }}
