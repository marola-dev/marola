# profile activity — a merged PR here pings h0ffmann/h0ffmann, which rebuilds its recent-activity list
# right away (nix-config's reusable profile-ping.yml). Needs the PROFILE_DISPATCH_TOKEN secret; without
# it the job only leaves a notice.
name: profile activity

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions: {}

jobs:
  ping:
    if: github.event.pull_request.merged
    uses: h0ffmann/nix-config/.github/workflows/profile-ping.yml@main
    secrets:
      token: ${{ secrets.PROFILE_DISPATCH_TOKEN }}
