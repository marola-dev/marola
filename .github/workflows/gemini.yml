# Gemini review on request: request the team `gemini` on a PR (marola-dev/marola#641).
name: gemini

on:
  # Base-branch workflow and secrets, so a fork PR gets a review; only a maintainer can request the team.
  pull_request_target:
    types: [review_requested]

permissions:
  contents: read

jobs:
  gemini:
    if: github.event.requested_team.slug == 'gemini'
    uses: marola-dev/marola-devkit/.github/workflows/gemini-review.yml@v0.7.0
    secrets: inherit
    with:
      devkit-ref: v0.7.0
