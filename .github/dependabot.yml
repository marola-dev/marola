# Scala/sbt dependencies (core/local/azure/cli) are watched by scala-steward.yml instead — see
# CONTRIBUTING.md.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/dspy"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/finetune"
    schedule:
      interval: "weekly"
