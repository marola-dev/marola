# The label taxonomy, versioned. `just labels-sync` reconciles GitHub against this file;
# GitHub's settings UI is no longer the source of truth. MIP-0063 §5.2.
#
# Colours are lowercase hex without '#'; the diff compares them case-insensitively, so a label
# created through the UI in uppercase is not reported as a change.
# Shape is fixed and parsed strictly by scripts/issues.sh: one `- name:` per label, then
# `color:` and `description:`, in that order. Anything else is an error, not a warning.

- name: "accessibility"
  color: "f143ab"
  description: "Barrier affecting people with disabilities"

- name: "agent-ready"
  color: "0e8a16"
  description: "Passes the five-rule Definition of Ready — an agent may begin work on it (MIP-0063 §5.4)"

- name: "area/accessibility"
  color: "c2e0c6"
  description: "Parking/toilets/showers/lifeguard beach data"

- name: "area/conditions"
  color: "1d76db"
  description: "Live sea/weather/tide data, forecasting, caching/latency of an answer"

- name: "area/dev-tooling"
  color: "bfd4f2"
  description: "Claude Code / OpenCode / agentic-tooling dev workflow, not the product"

- name: "area/map-site"
  color: "006b75"
  description: "The static map/site — markers, layout, copy"

- name: "area/ml-infra"
  color: "fbca04"
  description: "MLflow, llm4s/DSPy, fine-tuned model, forecasting/jellyfish research"

- name: "area/outreach"
  color: "e99695"
  description: "Promotion — book, exporter, Instagram, waitlist/site copy"

- name: "area/positioning"
  color: "ededed"
  description: "Product naming/positioning docs (MIP-0029)"

- name: "area/safety"
  color: "d93f0b"
  description: "Safety-footer text, hazard/escalation behavior"

- name: "area/sea-life"
  color: "5319e7"
  description: "Jellyfish/whale heuristics, sea-lore corpus"

- name: "area/telegram-bot"
  color: "0052cc"
  description: "The bot surface — replies, digest, subscriptions, matching"

- name: "area/unscoped"
  color: "eeeeee"
  description: "No MIP and no path matched a known area — needs a human look"

- name: "area/water-quality"
  color: "0e8a16"
  description: "Bathing-water quality per sampling point"

- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency file"

- name: "documentation"
  color: "0075ca"
