# marola — MIP-0008 §5.2: the CLI as a container, with an Ollama sidecar when you want the LLM
# passes. Needs Docker Compose ≥ 2.20 (`depends_on … required: false`).
#
#   docker compose run --rm marola --brief --lat -27.6733 --lon -48.47                          # no LLM: Overpass + Open-Meteo + scoring
#   docker compose --profile ollama run --rm marola --summarize --lat -27.6733 --lon -48.47     # + draft + reviewer on llama3.2 (pulled once)
#   docker compose --profile local run --rm marola-local --summarize --lat -27.6733 --lon -48.47  # marola-llama3.2, from marola-ml's :local image
#   docker compose --profile ollama run --rm marola --ask "what if I'm caught in a rip current?"
#   docker compose --profile mlflow up -d mlflow                                                # MIP-0010: the experiment ledger, http://127.0.0.1:5000
#
# The image is ghcr.io/marola-dev/marola:jvm; `just corpus-fetch && docker compose build` rebuilds it
# from this checkout.
# `.env` (gitignored, see .env.example) is read if present — MAROLA_ORIGIN_LAT/LON, provider
# switches — and never baked into the image. Ollama's models live in the `ollama-models` volume,
# marola's runtime files (knowledge index, sightings, benchmarks) in `marola-data`.
# Change the stock model with MAROLA_LOCAL_LLM_MODEL=llama3.2:1b in the environment or .env.

services:
  marola:
    image: ghcr.io/marola-dev/marola:jvm
    build:
      context: .
      target: jvm
    env_file:
      - path: .env
        required: false
    environment:
      MAROLA_LOCAL_LLM_BASE_URL: http://ollama:11434/v1
      MAROLA_LOCAL_LLM_MODEL: ${MAROLA_LOCAL_LLM_MODEL:-llama3.2}
      # MIP-0010: a bare key passes the host value through, or omits it (RunLedger.Noop).
      MAROLA_MLFLOW_TRACKING_URI:
      MAROLA_MLFLOW_EXPERIMENT:
    volumes:
      - marola-data:/app/data
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
        required: false

  # Same CLI image, the Tier 1 fine-tune as the model, served by marola-ml's marola-local image
  # (its Dockerfile.local: Ollama with marola-llama3.2 already in its store, built and
  # benchmark-gated by its docker-local.yml) — profile `local`. No pull, no `ollama create` on the
  # user's machine.
  marola-local:
    extends: marola
    profiles: [local]
    environment:
      MAROLA_LOCAL_LLM_BASE_URL: http://ollama-local:11434/v1
      MAROLA_LOCAL_LLM_MODEL: marola-llama3.2
    depends_on:
      ollama-local:
        condition: service_healthy

  ollama-local:
    image: ghcr.io/marola-dev/marola-ml:local
    profiles: [local]
    # A GPU makes the summary ~10x faster; uncomment on a machine with the NVIDIA toolkit:
    # deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  ollama:
    image: ollama/ollama:0.33.3
    profiles: [ollama]
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
    # A GPU makes the summary ~10x faster; uncomment on a machine with the NVIDIA toolkit:
    # deploy: { resources: { reservations: { devices: [{ driver: nvidia, count: all, capabilities: [gpu] }] } } }

  # One-shot: make sure the stock model is in the volume (no-op after the first run).
  ollama-pull:
    image: ollama/ollama:0.33.3
    profiles: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull"]
    command: ["${MAROLA_LOCAL_LLM_MODEL:-llama3.2}"]
    depends_on:
      ollama:
        condition: service_healthy

  # MIP-0010: a local MLflow server, SQLite + artifacts under .tmp/mlflow (rm -rf to reset). The
  # image has no ENTRYPOINT/CMD, so the full `mlflow server` command is required. Bound to
  # 127.0.0.1 only: no auth. Not a `depends_on` of `marola` — MAROLA_MLFLOW_TRACKING_URI is the
  # only, opt-in, coupling.
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0
    profiles: [mlflow]
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
    volumes:
      - ./.tmp/mlflow:/mlflow
    ports:
      - 127.0.0.1:5000:5000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  ollama-models:
  marola-data:
