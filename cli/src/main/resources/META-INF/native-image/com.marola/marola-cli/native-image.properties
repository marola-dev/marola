# GraalVM native-image arguments for marola's CLI (MIP-0008 task 3). Read automatically from the
# jar/classpath, so `sbt cli/nativeImage` and the Dockerfile's `native-image -jar marola.jar`
# build the same binary from the same options.
#
# slf4j/logback/Jackson hold objects in static fields that end up in the image heap (reached
# through the MCP SDK's Jackson) — the spike's first two
# failures; initialising them at build time is the documented fix. `-march=compatibility` keeps
# the binary runnable on any x86-64 (CI runners, older laptops).
Args = --initialize-at-build-time=org.slf4j,ch.qos.logback,com.fasterxml.jackson \
       -march=compatibility \
       --no-fallback \
       -H:+ReportExceptionStackTraces \
       -Dsun.misc.unsafe.memory.access=allow
