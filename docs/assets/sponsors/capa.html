<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa Sponsors</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400..900&display=block");
:root {
  --navy: #0b4261; --mark: #057b9e; --cyan: #1ac5da; --cyan-b: #19ddf0; --cyan-d: #1badc5;
  --dark: #0d1218; --dark-2: #161d25; --dark-line: #26303b; --dark-muted: #8a939e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--dark); font-family: Inter, sans-serif; font-kerning: normal; }
.cover { width: 460px; height: 200px; position: relative; overflow: hidden; color: #fff;
  background: radial-gradient(120% 140% at 88% -20%, #12324a 0%, rgb(13 18 24 / 0) 55%), var(--dark); }
.grid { position: absolute; inset: 0; background-image: radial-gradient(rgb(26 197 218 / .16) 1px, transparent 1.2px); background-size: 14px 14px;
  -webkit-mask-image: linear-gradient(100deg, transparent 35%, #000 75%); mask-image: linear-gradient(100deg, transparent 35%, #000 75%); }
.kick { position: absolute; top: 18px; left: 24px; right: 24px; display: flex; justify-content: space-between; align-items: center;
  font-size: 10px; font-weight: 600; color: var(--dark-muted); letter-spacing: .02em; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px 3px 7px; border-radius: 999px; color: #f3c6dc;
  background: rgb(219 97 162 / .12); border: 1px solid rgb(219 97 162 / .45); font-weight: 700; }
.pill svg { width: 11px; height: 11px; }
.brand { position: absolute; left: 24px; top: 48px; display: flex; align-items: center; gap: 14px; }
.brand img { width: 60px; height: 60px; filter: drop-shadow(0 0 18px rgb(26 197 218 / .35)); }
.word { font-size: 44px; font-weight: 850; letter-spacing: -0.05em; line-height: 1; color: #eef2f5; }
.word span { background: linear-gradient(100deg, var(--mark) 0%, var(--cyan) 55%, var(--cyan-b) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { margin-top: 7px; font-size: 12.5px; line-height: 1.3; color: #c9d0d7; letter-spacing: -0.01em; }
.sub b { color: #fff; font-weight: 700; }
.lnt { position: absolute; right: 24px; top: 62px; background: #fff; border-radius: 8px; padding: 7px 8px; box-shadow: 0 0 0 1px rgb(255 255 255 / .2), 0 6px 18px rgb(0 0 0 / .35); }
.lnt img { display: block; width: 76px; height: auto; }
.waves { position: absolute; left: 0; right: 0; bottom: 0; height: 58px; }
.foot { position: absolute; left: 24px; right: 24px; bottom: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 2;
  font-size: 10px; font-weight: 700; }
.foot .tags { display: flex; gap: 6px; }
.foot .tags span { color: #fff; background: rgb(11 66 97 / .55); border: 1px solid rgb(255 255 255 / .35); padding: 3px 8px; border-radius: 999px; }
.foot .url { color: var(--navy); background: rgb(255 255 255 / .94); padding: 4px 10px; border-radius: 999px; font-family: "JetBrains Mono", ui-monospace, monospace; }
</style>
</head>
<body>
<section class="cover">
  <div class="grid"></div>
  <div class="kick"><span>código aberto, ciência aberta</span>
    <span class="pill"><svg viewBox="0 0 16 16" fill="#db61a2"><path d="M8 14.25.345 6.59a4.25 4.25 0 0 1 6.01-6.01L8 2.22 9.646.58a4.25 4.25 0 0 1 6.01 6.01Z"/></svg>GitHub Sponsors</span></div>
  <div class="brand">
    <img src="../logo.svg" alt="">
    <div>
      <div class="word">marola<span>.dev</span></div>
      <div class="sub">qualidade da água e <b>ciência cidadã</b><br>para as praias do Brasil.</div>
    </div>
  </div>
  <div class="lnt"><img src="lnt-proud-partner.png" alt="Leave No Trace proud partner"></div>
  <svg class="waves" viewBox="0 0 460 58" preserveAspectRatio="none">
    <defs><linearGradient id="wg" x1="0" x2="1"><stop offset="0" stop-color="#1badc5"/><stop offset=".5" stop-color="#1ac5da"/><stop offset="1" stop-color="#19ddf0"/></linearGradient></defs>
    <path d="M0 16 C 58 4, 115 4, 172 16 S 287 28, 345 16 S 430 4, 460 11 L460 58 L0 58 Z" fill="url(#wg)" opacity=".18"/>
    <path d="M0 27 C 64 17, 128 17, 192 27 S 320 37, 384 27 S 443 20, 460 22 L460 58 L0 58 Z" fill="url(#wg)" opacity=".45"/>
    <path d="M0 37 C 68 30, 136 30, 204 37 S 341 44, 409 37 S 451 33, 460 33 L460 58 L0 58 Z" fill="url(#wg)"/>
  </svg>
  <div class="foot"><span class="tags"><span>CC-BY-4.0</span><span>DOI no Zenodo</span></span><span class="url">github.com/marola-dev</span></div>
</section>
</body></html>
