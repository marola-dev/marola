<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img">
<style>
text{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.name{fill:#f8fafc;font-size:15px;font-weight:700}
.sub{fill:#94a3b8;font-size:11.5px}
.edge{fill:#cbd5e1;font-size:11px;paint-order:stroke;stroke:#020617;stroke-width:5px;stroke-linejoin:round}
.title{fill:#e2e8f0;font-size:14px;font-weight:600}
.region{fill:#22d3ee;font-size:13px;font-weight:700}
.regionsub{fill:#67e8f9;font-size:11px;opacity:.8}
.leg{fill:#94a3b8;font-size:11px}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.6"/></pattern>
<marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#7dd3fc"/></marker>
<marker id="b" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#c4b5fd"/></marker>
<marker id="o" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#fb923c"/></marker>
</defs>
<rect width="1000" height="620" rx="18" fill="#020617"/>
<rect width="1000" height="620" rx="18" fill="url(#grid)"/>
<circle cx="34" cy="34" r="5" fill="#22d3ee"/>
