<rect x="720" y="232" width="230" height="86" rx="8" fill="rgba(120,53,15,0.45)" stroke="#fbbf24" stroke-width="1.6"/>
<text x="835.0" y="263.0" class="name" text-anchor="middle">marola-ml</text>
<text x="835.0" y="282.0" class="sub" text-anchor="middle">prompts · benchmark</text>
<text x="835.0" y="299.0" class="sub" text-anchor="middle">marola-sea, modelo próprio</text>
