<text x="42" y="86" class="region" text-anchor="start">marola · o guarda-chuva</text>
<text x="42" y="104" class="regionsub" text-anchor="start">MIPs · lista de fases · docs.marola.dev · cada repositório abaixo como submódulo git</text>
