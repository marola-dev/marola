<rect x="150" y="522" width="700" height="54" rx="8" fill="#0b1222"/>
<rect x="150" y="522" width="700" height="54" rx="8" fill="rgba(124,45,18,0.45)" stroke="#fb923c" stroke-width="1.6"/>
