# Free, semantic code-quality rules on top of scalafmt (`just quality`, ci.yml).
rules = [
  OrganizeImports,
  RemoveUnused,
  DisableSyntax,
  NoValInForComprehension,
  LeakingImplicitClassVal,
  NoAutoTupling
]

OrganizeImports {
  groupedImports = Merge
  groups = ["re:javax?\\.", "scala.", "kyo.", "marola.", "*"]
  removeUnused = true
  targetDialect = Scala3
}

DisableSyntax {
  # `Json.Parser` is a hand-rolled recursive-descent parser with an index `var` and while loops —
  # the one documented exception (EFFECTS-MAP.md §5). Everything else in marola is var-free.
  noVars = false
  noWhileLoops = false
  noNulls = false        # `== null` checks on java.io streams / JDK APIs
  noReturns = true
  noXml = true
  noFinalize = true
  noAsInstanceOf = true
  noIsInstanceOf = true
  noThrows = false       # thrown domain exceptions are the current error style (FABLE_REVIEW / SKILLS Stage 6)
}
