# Kroki, self-hosted, so diagram rendering never leaves the build host (MIP-0064 §4.3). Mermaid is
# a separate image — kroki delegates to it over HTTP and cannot render one without it.
#
# No `container_name:` on any of these. A container name is global to the daemon, and compose's
# project name defaults to this directory's, which is `mkdocs` in every checkout — so two builds
# on one host (two worktrees, or two CI jobs on the self-hosted runner) shared names and each
# `down` tore the other's stack out from under it. scripts/mkdocs.sh gives compose a project name
# derived from the checkout path instead, and asks it for the container id rather than assuming.
#
# Neither kroki port is published: only the mkdocs container talks to them, over this network.
# Publishing would also collide with `just docs-serve` on 8001.
services:
  kroki:
    image: yuzutech/kroki:0.32.1
    environment:
      - KROKI_MERMAID_HOST=mermaid
      - KROKI_EXCALIDRAW_HOST=excalidraw
    depends_on:
      mermaid:
        condition: service_healthy
      excalidraw:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 2s
      timeout: 2s
      retries: 30
      # Kroki is a JVM starting cold, often right after its first pull. Without this the 30 probes
      # are the whole budget and a slow start reads as an unhealthy dependency.
      start_period: 30s

  mermaid:
    image: yuzutech/kroki-mermaid:0.32.1
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8002"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 30s

  excalidraw:
    image: yuzutech/kroki-excalidraw:0.32.1
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8004"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 30s

  mkdocs:
    image: marola/mkdocs
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kroki:
        condition: service_healthy
