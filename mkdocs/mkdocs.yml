site_name: marola.dev docs
site_description: The ocean intelligence layer for a stretch of coast — guides and design proposals.
# Load-bearing, not cosmetic: with no site_url the privacy plugin force-adds Mermaid.js to every
# page (its own special case, plugins/privacy/plugin.py — Material normally injects it on demand,
# and it cannot tell on demand without a canonical URL). Kroki already renders the diagrams to SVG
# server-side, so that is 3.5 MB of dead JavaScript on all 97 pages, republished every docs change.
site_url: https://docs.marola.dev/
repo_url: https://github.com/marola-dev/marola
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: generated-docs

# Any unresolved internal link fails the build instead of shipping a 404. It does NOT cover a
# missing index.md (prepare-docs writes it from the umbrella README): mkdocs builds that with exit 0
# and no landing page, so scripts/mkdocs.sh checks for the file itself. MIP-0064 §4.4.
strict: true
# Anchor checks are info by default; at warn, strict fails a link to a heading that is not there.
validation:
  anchors: warn

# Built and reachable by URL, just not listed: the task files are execution bookkeeping for a MIP,
# linked from the MIP that owns them; a MIP's screenshots README is not a section.
not_in_nav: |
  6-MIPs/*.tasks.md
  6-MIPs/*/screenshots/*

# Off the site entirely, not merely out of the sidebar: benchmarks/ is a ledger of kept runs, a
# repo artefact rather than documentation. Links into it point at GitHub.
exclude_docs: |
  benchmarks/

# No `nav:`. mkdocs builds one from the file tree, sorted alphanumerically with index files first,
# which is why MIP-0001…MIP-0064 order correctly (four-digit zero padding) and why adding a MIP
# needs no edit here. MIP-0064 §4.4, decision 1.
#
# It is also why the sections carry `1-`…`6-` prefixes (MIP-0074 §5.1): with no nav, that
# ordering can only come from the filenames, and mkdocs builds each section's label from its
# directory name, so the digits are visible in the sidebar. That was the accepted trade.

theme:
  name: material
  # overrides/404.html forwards the moved prefixes (MIP-0074 Appendix B).
  custom_dir: overrides
  # c0-traced's mark, the maintainer's own traced artwork, used for both. Its README warns the
  # emblem goes to mush at 16px and points at g2-cut-wave's favicon instead; that was overridden
  # deliberately — the tab icon is the place to check it. The mark carries an opaque white disc
  # (its separators are white fills in the source), so it reads as a badge on the coloured header
  # rather than needing a separate on-dark variant.
  favicon: assets/favicon.svg
  logo: assets/logo.svg
  features:
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
  # Dark only, so every diagram is styled for one background (MIP-0068 §5.2).
  palette:
    scheme: slate
    primary: teal
    accent: teal

extra_css:
  - assets/marola.css

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

# A hooks: entry runs as a plugin. @event_priority puts it ahead of the kroki plugin below, so
# every ```mermaid fence already carries a pinned font-family before Kroki measures it — #511.
hooks:
  - hooks/mermaid_font.py

plugins:
  - search
  # Downloads Material's webfont (and any other external asset) at build time and rewrites the
  # references to local copies, so the pages keep Roboto without asking fonts.googleapis.com for
  # it on every visit. This is the only thing keeping that true — strip_external_scripts.py
  # matches <script src>, and a webfont is a stylesheet <link>, so its check cannot see it.
  - privacy:
      # Mermaid.js is fetched but referenced by nothing: Kroki renders the diagrams to SVG at
      # build time, so the page never needs it. Without this it is 3.5 MB — most of the vendored
      # payload — written into every publish for no reader.
      assets_exclude:
        - unpkg.com/*
  # No `offline`. The reference repo carries it, but it is for handing someone a zip they open
  # from file://, and it silently forces use_directory_urls: false — which would publish
  # /docs/ARCHITECTURE.html instead of /docs/architecture/, against MIP-0064 §7.2.
  - kroki:
      # Not kroki.io: rendering happens in the compose stack next door, so no doc content leaves
      # the build host. `kroki` is the service name in docker-compose.yml.
      server_url: http://kroki:8000
      # Default is `kroki-`, which would render only ```kroki-mermaid fences. Empty claims plain
      # ```mermaid too, so the repo's two diagrams render here *and* on GitHub, unedited.
      fence_prefix: ""
      # POST writes the SVG next to the page in site_dir. GET would emit an <img> pointing at
      # this container, i.e. a localhost URL on the deployed site, and break `script-src 'self'`.
      http_method: POST
      # A render error fails the build naming the page, rather than shipping an inline error box.
      fail_fast: true
      # No companion runs for these, and with an empty fence_prefix the plugin would claim their
      # fences anyway. Off, a ```bpmn fence stays a code block. diagramsnet is already off by
      # default; stated so --self-test can hold it there.
      enable_bpmn: false
      enable_diagramsnet: false
      # marola.css's slate inks. Injected into mermaid, d2, plantuml, c4plantuml, graphviz,
      # nomnoml, structurizr and blockdiag only; dbml, vegalite and excalidraw fences take
      # {bg-dark=white} instead, which marola.css turns into a light card.
      styles:
        box: { fill: "#0b4261", stroke: "#1ac5da" }
        actor: { fill: "#0b4261", stroke: "#1ac5da" }
        text: { color: "#ffffff" }
        line: { stroke: "#1ac5da", font-color: "#ffffff", label-background: "#082f45" }
        note: { fill: "#082f45", stroke: "#19ddf0", color: "#ffffff" }
        package: { fill: "#082f45", stroke: "#057b9e", color: "#ffffff" }
        background: { fill: "transparent" }
  # Single page moves, old path to new (MIP-0074 Appendix B); prefix moves are overrides/404.html's.
  - redirects:
      redirect_maps:
        marola-app.md: 5-Repos/marola-app/index.md
        2-Building-marola/EFFECTS-MAP.md: 5-Repos/marola-app/1-design_effects.md
        2-Building-marola/SCALA3-JDK-REVIEW.md: 5-Repos/marola-app/2-libraries_scala3-jdk.md
        2-Building-marola/API.md: 5-Repos/marola-app/4-reference_api.md
        3-Working-on-the-repo/AGENT-SKILLS.md: 3-Ways-of-working/AGENT-SKILLS.md
        3-Working-on-the-repo/CI-CD.md: 3-Ways-of-working/CI-CD.md
        3-Working-on-the-repo/DEV-FLOW.md: 3-Ways-of-working/DEV-FLOW.md
        3-Working-on-the-repo/DIAGRAMS.md: 3-Ways-of-working/DIAGRAMS.md
        3-Working-on-the-repo/ISSUE-FLOW.md: 3-Ways-of-working/ISSUE-FLOW.md
        3-Working-on-the-repo/GEMINI-CODE-ASSIST.md: 4-Research-and-plans/GEMINI-CODE-ASSIST.md
        3-Working-on-the-repo/SELF-DOCUMENTING.md: 4-Research-and-plans/SELF-DOCUMENTING.md
        # Retired; the last commit that had it.
        4-Research-and-plans/FABLE_REVIEW.md: https://github.com/marola-dev/marola/blob/70526c8d22ad785c7d895f9241e1f6839f215add/docs/4-Research-and-plans/FABLE_REVIEW.md
        # Retired: the MIP index's verdicts are the ordering now.
        4-Research-and-plans/ROADMAP.md: 6-MIPs/README.md
