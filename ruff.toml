# Free Python lint/format for every .py in the repo (`just quality-other`, ci.yml, `just prepush`).
target-version = "py312"
line-length = 100
# `ruff check .` (just quality-other, ci.yml, the pre-push hook) must not descend into nested
# checkouts: Claude Code's agent worktrees live under .claude/worktrees/ and stack worktrees under
# .tmp/wt-*, each a full copy of the repo at some other commit — ruff walks a nested .git checkout
# even when .gitignore excludes it, and the hook once reported a fixed file's old copy from there.
# Every submodule path in .gitmodules too: each is linted in its own repo (ruff_exclude_check.py).
extend-exclude = [
  ".claude/worktrees", ".tmp",
  "marola-site", "marola-corpus", "marola-ml", "marola-app",
  "marola-oods", "marola-skills", "marola-agents", "marola-research",
]
[lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # long doc/comment lines are deliberate in this repo
